name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # для сквозного сценария: bcloud со служебным API и исходники установщика Nuvrion
      - uses: actions/checkout@v4
        with:
          repository: I22rusIBarney/bobr-cloud
          path: _deps/bobr-cloud
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: nuvrion-kvn/Nuvrion-Vision-Installer
          path: _deps/nuvrion
      - name: bcloud со служебным API
        run: |
          cd _deps/bobr-cloud
          if [ ! -f app/web/service_api.py ]; then
            echo "В main bcloud ещё нет /api/svc — беру ветку feat/service-api"
            git checkout -q origin/feat/service-api
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt -r _deps/bobr-cloud/requirements.txt
      - name: Синтаксис админки и установщика
        run: |
          python - <<'PY'
          import re, pathlib
          s = pathlib.Path("web/admin.html").read_text()
          pathlib.Path("/tmp/admin.js").write_text(max(re.findall(r"<script>(.*?)</script>", s, re.S), key=len))
          PY
          node --check /tmp/admin.js
          node --check web/static/ui.js
          bash -n install.sh
          shellcheck -S error install.sh tests/mock_installer.sh
      - name: Тесты
        env:
          BCLOUD_DIR: ${{ github.workspace }}/_deps/bobr-cloud
          NV_SRC: ${{ github.workspace }}/_deps/nuvrion/src
        # упавшие проверки — ещё и аннотациями: их видно через API без скачивания логов
        run: |
          set -o pipefail
          pytest -q -rA 2>&1 | tee /tmp/pytest.out || {
            # одна аннотация (GitHub показывает не больше 10 на шаг): FAIL-строки и хвост вывода
            { grep -E 'FAIL ' /tmp/pytest.out | grep -v PASS | head -20; echo ----; grep -v ' PASS ' /tmp/pytest.out | tail -50; } \
              | cut -c1-400 | python3 -c 'import sys; print("::error::" + sys.stdin.read().replace("%", "%25").replace("\n", "%0A"))'
            exit 1; }

  # Готовый образ для серверов: только с main и только если тесты прошли.
  # bnodes update скачивает ghcr.io/<владелец>/<репозиторий>:sha-<коммит> вместо сборки на VPS.
  image:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Имя образа
        run: echo "IMG=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # сначала собираем локально и проверяем с теми же ограничениями, что в docker-compose.yml
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: bobr-nodes:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Образ работает без привилегий (cap_drop ALL, no-new-privileges)
        run: |
          mkdir smoke && sudo chown 0:0 smoke && sudo chmod 700 smoke   # как data на сервере: root, 700
          docker run -i --rm --cap-drop ALL --security-opt no-new-privileges:true -v "$PWD/smoke:/srv/data" bobr-nodes:smoke python - <<'PY'
          import pexpect, subprocess
          from bot import sshkey, engine, web, security, runner  # noqa: F401 — все модули импортируются
          path, pub = sshkey.ensure('/srv/data/ssh')
          assert pub.startswith('ssh-ed25519 '), pub
          kh = '/srv/data/ssh/known_hosts'
          open(kh, 'a').close()
          engine.forget_host(kh, '192.0.2.1')
          c = pexpect.spawn('ssh', ['-V'], encoding='utf-8'); c.expect(pexpect.EOF); print('ssh:', c.before.strip())
          r = engine.Remote({'ip': '127.0.0.1', 'ssh_port': 1, 'known_hosts': kh, 'ssh_key': path}, None)
          rc, out = r.run('true', 20)
          assert rc != 0 and 'Connection refused' in out, (rc, out)
          print('ok: ключ, known_hosts, pexpect и ssh работают без привилегий')
          PY
          printf ':80 {\n\trespond "ok"\n}\n' > Caddyfile.smoke
          docker run -d --name caddy-smoke --cap-drop ALL --cap-add NET_BIND_SERVICE --security-opt no-new-privileges:true \
            -p 18080:80 -v "$PWD/Caddyfile.smoke:/etc/caddy/Caddyfile:ro" caddy:2
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18080 && break; sleep 1; done | grep -qx ok \
            || { docker logs caddy-smoke; exit 1; }
          echo "ok: Caddy слушает 80 с cap_drop ALL + NET_BIND_SERVICE"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMG }}:latest
            ${{ env.IMG }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Образ доступен серверам без логина
        run: |
          tok=$(curl -fsS "https://ghcr.io/token?scope=repository:${IMG#ghcr.io/}:pull" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("token",""))' || true)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $tok" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/${IMG#ghcr.io/}/manifests/sha-${GITHUB_SHA}")
          if [ "$code" = 200 ]; then echo "Образ публичный — bnodes update скачает его"; else
            echo "::warning::Пакет ${IMG} приватный (HTTP $code): серверы не смогут его скачать и будут собирать сами. Откройте Packages → bobr-nodes → Package settings → Change visibility → Public."
          fi
