<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bobr Nodes</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/ui.css">
<style>
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); }
  .stats > div { padding: 12px 16px 13px; position: relative; }
  .stats > div + div::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: .5px; background: var(--sep); }
  .stats b { display: block; font-size: 22px; line-height: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 13px; color: var(--hint); }
  .stats .ok b { color: var(--ok); } .stats .bad b { color: var(--danger); } .stats .run b { color: var(--accent-text); }
  .status-line { font-size: 13px; line-height: 18px; padding: 0 16px; margin: 7px 0 0; }
  .status-line.ok { color: var(--ok); } .status-line.bad { color: var(--danger); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; letter-spacing: 0; word-break: break-all; }
  .actions { display: flex; gap: 10px; margin: 0 var(--gutter) 30px; }
  .actions .btn { flex: 1; }
  .pad { margin: 0 var(--gutter) 22px; }
  .notice { margin: 0 var(--gutter) 18px; padding: 12px 14px; border-radius: 14px; background: var(--warn-soft); color: var(--warn); font-size: 14px; line-height: 19px; }
  .notice b { color: var(--text); }
  .log { margin: 0 var(--gutter) 30px; padding: 12px; border-radius: 14px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line);
         font: 11.5px/1.45 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-all; max-height: 55vh; overflow: auto; color: var(--hint); }
  .stage { display: flex; align-items: center; gap: 10px; }
  .stage i { width: 22px; height: 22px; border-radius: 11px; display: grid; place-items: center; font-style: normal; font-size: 12px; flex: none;
             background: var(--surface-2); color: var(--hint); }
  .stage i.done { background: var(--ok-soft); color: var(--ok); }
  .stage i.now { background: var(--accent-soft); color: var(--accent-text); animation: pulse 1.2s infinite; }
  .stage i.fail { background: var(--danger-soft); color: var(--danger); }
  @keyframes pulse { 50% { opacity: .45; } }
  .offer[aria-pressed="true"] .t { color: var(--accent-text); }
  .offer .tick { width: 22px; height: 22px; color: var(--accent-text); }
  .total { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px; }
  .total b { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .domains { padding: 10px 16px 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .domains span { font: 13px ui-monospace, "SF Mono", Menlo, monospace; padding: 4px 9px; border-radius: 8px; background: var(--surface-2); }
  textarea.wide { width: 100%; min-height: 110px; box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/static/ui.js"></script>
<script>
UI.init();
const { h, row, group, icon } = UI;
const api = UI.api('/api/');
let ST = null, FIELDS = null;
const rubK = kop => UI.rub(Math.round((kop || 0) / 100));
const STATUS = { queued: ['В очереди', ''], buying: ['Покупка', 'accent'], provisioning: ['Создание сервера', 'accent'],
  deploying: ['Установка', 'accent'], done: ['Готово', 'ok'], failed: ['Ошибка', 'bad'] };
const STAGE = { buy: 'Покупка', ip: 'Создание сервера', dns: 'DNS', ssh: 'SSH', install: 'Установка ноды', panel: 'Панель', check: 'Проверка' };
const badge = (text, cls) => h('span', { class: 'badge ' + (cls || '') }, text);
const statusLine = () => h('div', { class: 'status-line', role: 'status' });
function showStatus(el, r) { el.className = 'status-line ' + (r.ok ? 'ok' : 'bad'); el.textContent = r.message; UI.haptic(r.ok ? 'success' : 'error'); }
const title = (t, back) => [UI.nav.backLink(back || 'Bobr Nodes'), h('h1', { class: 'large-title' }, t)];

async function load() {
  try { ST = await api('state'); } catch (e) { ST = { error: e.message }; }
  UI.nav.refresh();
}

// ───────── главная ─────────
function home() {
  if (!ST) return h('div', {}, h('h1', { class: 'large-title' }, 'Bobr Nodes'), group(null, [h('div', { class: 'skeleton' }), h('div', { class: 'skeleton' })]));
  if (ST.error) return h('div', {}, h('h1', { class: 'large-title' }, 'Bobr Nodes'), h('div', { class: 'empty' }, icon('alert'), h('b', {}, 'Нет доступа'), ST.error));
  const s = ST.settings, j = ST.jobs;
  const v = h('div', {}, h('h1', { class: 'large-title' }, 'Bobr Nodes'),
    h('div', { class: 'subtitle' }, 'Покупка серверов в bcloud и установка нод Remnawave'));
  if (ST.issues.length) v.append(h('div', { class: 'notice' }, h('b', {}, 'Чтобы начать: '), ST.issues.join(', ') + '.'));
  v.append(h('section', { class: 'group' }, h('div', { class: 'list' }, h('div', { class: 'stats' },
    h('div', { class: 'run' }, h('b', {}, String(j.active)), h('span', {}, 'в работе')),
    h('div', { class: 'ok' }, h('b', {}, String(j.done)), h('span', {}, 'готово')),
    h('div', { class: 'bad' }, h('b', {}, String(j.failed)), h('span', {}, 'с ошибкой'))))));
  const go = h('button', { class: 'btn', type: 'button', disabled: ST.issues.length > 0, onclick: () => { D = null; UI.nav.push(() => deployView()); } }, icon('plus'), 'Развернуть ноды');
  v.append(h('div', { class: 'pad' }, go));
  v.append(group(null, [row({ icon: 'stack', tile: '#0A84FF', title: 'Задачи', detail: j.active ? 'в работе: ' + j.active : '', onClick: () => UI.nav.push(jobsView) })]));
  v.append(group('Группы', [
    ...ST.profiles.map(p => row({ icon: 'stack', tile: '#0A84FF', title: p.name,
      sub: 'Серверов: ' + p.servers + (p.owner_label ? ' · ' + p.owner_label : '') + (p.script ? ' · ' + p.script : ''),
      right: p.active ? badge('в работе: ' + p.active, 'accent') : p.failed ? badge('ошибок: ' + p.failed, 'bad') : null,
      onClick: () => UI.nav.push(() => groupView(p.id)) })),
    row({ icon: 'plusCircle', tile: '#34C759', title: 'Новая группа', cls: 'accent', onClick: () => openProfile(null) })],
    'Группа — своя панель Remnawave, свой Cloudflare и свой клиент в bcloud: серверы группы покупаются от его имени, с его баланса и видны ему в bcloud.'));
  v.append(group(null, [row({ icon: 'terminal', tile: '#5856D6', title: 'Мои скрипты', sub: 'свои скрипты установки нод с GitHub', onClick: () => { SCR = null; UI.nav.push(scriptsView); } })]));
  const ok = k => s[k] && s[k].set;
  v.append(group('Подключения', [
    row({ icon: 'store', tile: '#FF9500', title: 'bcloud', sub: 'покупка серверов', right: badge(ok('bcloud_url') && ok('bcloud_token') ? 'Подключён' : 'Не настроен', ok('bcloud_url') && ok('bcloud_token') ? 'ok' : 'bad'), onClick: () => UI.nav.push(bcloudView) }),
    row({ icon: 'globe', tile: '#FF9500', title: 'Cloudflare', sub: 'DNS-записи нод', right: badge(ok('cf_token') ? 'Подключён' : 'Не настроен', ok('cf_token') ? 'ok' : 'bad'), onClick: () => UI.nav.push(cfView) }),
    row({ icon: 'sparkle', tile: '#5856D6', title: 'Gemini', sub: 'разбор своих скриптов', right: badge(ok('gemini_key') ? 'Подключён' : 'Не нужен', ok('gemini_key') ? 'ok' : ''), onClick: () => UI.nav.push(geminiView) }),
    row({ icon: 'key', tile: '#8E8E93', title: 'SSH-ключ и очередь', detail: 'по ' + (s.parallel.value || 3), onClick: () => UI.nav.push(otherView) })]));
  return v;
}

// ───────── настройки ─────────
function settingField(key, opts = {}) {
  const st = ST.settings[key];
  const i = opts.area ? h('textarea', { rows: 3, placeholder: opts.ph || '', spellcheck: false, style: 'text-align:left' })
    : h('input', { type: st.secret ? 'password' : (opts.type || 'text'), inputmode: opts.inputmode, autocomplete: 'off', autocapitalize: 'off', spellcheck: false,
      placeholder: st.secret && st.set ? 'оставить ' + st.hint : (opts.ph || '') });
  i.value = st.secret ? '' : (st.value || '');
  return [i, h('label', { class: 'field stack' }, h('label', {}, st.label), i)];
}
function settingsForm(header, keys, footer, check, opts = {}) {
  const fields = keys.map(k => [k, ...settingField(k, (opts.fields || {})[k] || {})]);
  const status = statusLine();
  const save = h('button', { class: 'btn', type: 'button' }, 'Сохранить');
  save.onclick = UI.busy(save, async () => {
    const values = Object.fromEntries(fields.map(([k, i]) => [k, i.value]));
    const r = await UI.run(() => api('settings', 'POST', { values }));
    if (!r) return;
    ST.settings = r.settings; ST.issues = r.issues;
    fields.forEach(([k, i]) => { if (ST.settings[k].secret) { i.value = ''; i.placeholder = 'оставить ' + ST.settings[k].hint; } });
    if (check) showStatus(status, await api(check, 'POST')); else UI.toast('Сохранено');
  });
  const test = check ? h('button', { class: 'btn tinted', type: 'button' }, 'Проверить') : null;
  if (test) test.onclick = UI.busy(test, async () => { const r = await UI.run(() => api(check, 'POST')); if (r) showStatus(status, r); });
  return [h('section', { class: 'group' }, h('div', { class: 'group-h' }, header), h('div', { class: 'list' }, fields.map(f => f[2])),
    footer ? h('div', { class: 'group-f' }, footer) : null, status), h('div', { class: 'actions' }, test, save)];
}
function bcloudView() {
  return h('div', {}, ...title('bcloud'), ...settingsForm('Подключение', ['bcloud_url', 'bcloud_token', 'bcloud_tg_id'],
    h('span', {}, 'Токен и адрес покажет команда ', h('span', { class: 'mono' }, 'bcloud api-token'), ' на сервере bcloud. Покупки идут с баланса указанного аккаунта — он должен быть в ADMIN_IDS bcloud.'),
    'check/bcloud', { fields: { bcloud_url: { ph: 'https://bobr-cloud.online' }, bcloud_tg_id: { inputmode: 'numeric' } } }));
}
function cfView() {
  return h('div', {}, ...title('Cloudflare'), ...settingsForm('API-токен', ['cf_token'],
    'Cloudflare → My Profile → API Tokens → Create Token. Права: Zone → DNS → Edit и Zone → Zone → Read, для зон с доменами нод. Если зоны профиля в другом аккаунте — задайте токен в самом профиле.', 'check/cloudflare'));
}
function otherView() {
  return h('div', {}, ...title('SSH-ключ и очередь'), ...settingsForm('Доступ и скорость', ['ssh_pubkey', 'parallel'],
    'Публичный ключ (содержимое .pub) добавляется на каждый новый сервер — входить можно будет без пароля. Пусто или «-» — не добавлять. Параллельно ставится не больше указанного числа нод, остальные ждут в очереди.',
    null, { fields: { ssh_pubkey: { area: true, ph: 'ssh-ed25519 AAAA… me@laptop' }, parallel: { inputmode: 'numeric' } } }));
}

// ───────── мои скрипты ─────────
let SCR = null;
async function loadScripts() { try { SCR = await api('scripts'); } catch (e) { SCR = { error: e.message, scripts: [] }; } }
const SST = { approved: ['Утверждён', 'ok'], draft: ['Черновик', 'warn'] };
function scriptsView() {
  if (SCR === null) { loadScripts().then(() => UI.nav.refresh()); return h('div', {}, ...title('Мои скрипты'), group(null, [h('div', { class: 'skeleton' })])); }
  const v = h('div', {}, ...title('Мои скрипты'),
    h('div', { class: 'subtitle' }, 'Свои скрипты установки нод с GitHub: Gemini разбирает скрипт, вы утверждаете рецепт — бот ставит по нему.'));
  if (!SCR.gemini) v.append(h('div', { class: 'notice' }, h('b', {}, 'Нужен ключ Gemini: '), 'Подключения → Gemini.'));
  const url = h('input', { type: 'url', placeholder: 'https://github.com/автор/репозиторий', autocapitalize: 'off', spellcheck: false, style: 'text-align:left' });
  const status = statusLine();
  const add = h('button', { class: 'btn', type: 'button' }, icon('plus'), 'Добавить');
  const create = async (path) => {
    const r = await api('scripts', 'POST', { url: url.value, path });
    if (r.choose) {
      UI.sheet('Какой файл ставит ноду?', close => h('div', {}, group(null, r.choose.map(c => row({ title: c.path, detail: Math.round(c.size / 1024) + ' КБ',
        onClick: () => { close(); UI.run(() => create(c.path)); } })), 'Файлы .sh на коммите ' + r.sha.slice(0, 12) + '.')));
      return;
    }
    SCR = null; UI.toast('Скрипт загружен');
    UI.nav.push(() => scriptView(r.id, true));
  };
  add.onclick = UI.busy(add, async () => { try { await create(); status.textContent = ''; } catch (e) { showStatus(status, { ok: false, message: e.message }); } });
  v.append(h('section', { class: 'group' }, h('div', { class: 'group-h' }, 'Новый скрипт'),
    h('div', { class: 'list' }, h('label', { class: 'field stack' }, h('label', {}, 'Ссылка на репозиторий или файл'), url)),
    h('div', { class: 'group-f' }, 'Бот закрепит текущий коммит и SHA-256 файла: на ноды пойдёт ровно та версия, которую разобрали и утвердили.'), status),
    h('div', { class: 'pad' }, add));
  const list = SCR.scripts || [];
  v.append(group('Скрипты', [
    row({ icon: 'shield', tile: '#34C759', title: 'Nuvrion Vision', sub: 'встроенный · VLESS TLS Vision', right: badge('Встроенный', 'accent') }),
    ...list.map(s => row({ icon: 'terminal', tile: '#5856D6', title: s.title, sub: `${s.repo} · ${s.path} @ ${s.sha.slice(0, 7)}` + (s.used_by.length ? ' · группы: ' + s.used_by.join(', ') : ''),
      right: badge(...(SST[s.status] || [s.status, ''])), onClick: () => UI.nav.push(() => scriptView(s.id)) }))]));
  return v;
}
const SV = {};
function scriptView(id, autoAnalyze) {
  const s = SV[id];
  const reload = async () => { try { SV[id] = await api('scripts/' + id); } catch (e) { SV[id] = { error: e.message }; } UI.nav.refresh(); };
  if (!s) { reload(); return h('div', {}, ...title('Скрипт', 'Мои скрипты'), group(null, [h('div', { class: 'skeleton' })])); }
  if (s.error && !s.id) return h('div', {}, ...title('Скрипт', 'Мои скрипты'), h('div', { class: 'notice' }, s.error));
  const busy = SV['busy' + id];
  const analyze = async () => {
    SV['busy' + id] = true; UI.nav.refresh();
    try { SV[id] = await api('scripts/' + id + '/analyze', 'POST'); SCR = null; } catch (e) { UI.alert(e.message); }
    SV['busy' + id] = false; UI.nav.refresh();
  };
  if (autoAnalyze && !s.analysis && !busy && SCR !== undefined) { SV['auto' + id] = true; }
  if (SV['auto' + id] && !s.analysis && !busy) { SV['auto' + id] = false; analyze(); }
  const v = h('div', {}, ...title(s.title, 'Мои скрипты'),
    h('div', { class: 'subtitle' }, `${s.repo} · ${s.path} @ ${s.sha}`));
  v.append(group(null, [
    row({ title: 'Статус', right: badge(...(SST[s.status] || [s.status, ''])) }),
    row({ title: 'Открыть на GitHub', sub: 'эта версия, SHA-256 ' + s.sha256.slice(0, 12) + '…', onClick: () => UI.openLink(s.github) })]));
  if (busy) v.append(h('div', { class: 'notice', style: 'background:var(--accent-soft);color:var(--accent-text)' }, 'Gemini читает скрипт… обычно 20–60 секунд.'));
  const a = s.analysis;
  if (!a && !busy) v.append(h('div', { class: 'pad' }, h('button', { class: 'btn', type: 'button', onclick: analyze }, icon('sparkle'), 'Разобрать с Gemini')));
  if (a) {
    v.append(group('Что делает скрипт', [row({ cls: 'wrap', title: a.summary || '—' })]));
    if (a.recommendations.length) v.append(group('Рекомендации', a.recommendations.map(t => row({ cls: 'wrap', icon: 'info', tile: '#0A84FF', title: t }))));
    if (a.risks.length) v.append(group('Риски', a.risks.map(t => row({ cls: 'wrap', icon: 'alert', tile: '#FF3B30', title: t }))));
    if (a.recipe_error) v.append(h('div', { class: 'notice', style: 'background:var(--danger-soft);color:var(--danger)' }, 'Рецепт от Gemini не прошёл проверку: ' + a.recipe_error + '. Напишите ему ниже или поправьте вручную.'));
  }
  const d = s.describe;
  if (d) {
    const rows = [row({ cls: 'wrap', title: 'Запуск', sub: h('span', { class: 'mono' }, d.run) })];
    Object.entries(d.env || {}).forEach(([k, val]) => rows.push(row({ cls: 'wrap', title: 'Переменная ' + k, sub: h('span', { class: 'mono' }, val) })));
    d.prompts.forEach(p => rows.push(row({ cls: 'wrap', title: 'На «' + p.match + '»', sub: '→ ' + (p.answer.includes('{secret_key}') ? '‹SECRET_KEY›' : p.answer) + (p.why ? ' — ' + p.why : '') })));
    if (d.done_when) rows.push(row({ cls: 'wrap', title: 'Готово, когда в выводе', sub: h('span', { class: 'mono' }, d.done_when) }));
    d.post_commands.forEach(c => rows.push(row({ cls: 'wrap', icon: 'terminal', tile: '#FF9500', title: 'Выполнить после установки', sub: h('span', { class: 'mono' }, c) })));
    if (d.check_command) rows.push(row({ cls: 'wrap', title: 'Проверка', sub: h('span', { class: 'mono' }, d.check_command) }));
    rows.push(row({ cls: 'wrap', title: 'Профиль Xray', sub: d.profile.mode === 'file' ? `скрипт пишет ${d.profile.path} (inbound ${d.profile.inbound_tag || 'первый'}) — бот создаст профиль в панели` : 'уже есть в панели — выберите его в настройках группы' }));
    v.append(group('Как бот будет ставить', rows, 'На любой вопрос скрипта, которого нет в списке, бот остановится. Команды «после установки» выполняются под root — проверьте их.'));
    const acts = [];
    if (s.status !== 'approved') {
      const ok = h('button', { class: 'btn', type: 'button' }, icon('check'), 'Утвердить');
      ok.onclick = UI.busy(ok, async () => { const r = await UI.run(() => api('scripts/' + id + '/approve', 'POST'), 'Утверждён — можно выбрать в группе'); if (r) { SV[id] = r; SCR = null; UI.nav.refresh(); } });
      acts.push(ok);
    }
    const edit = h('button', { class: 'btn tinted', type: 'button' }, 'Править рецепт');
    edit.onclick = () => UI.sheet('Рецепт (JSON)', close => {
      const ta = h('textarea', { class: 'wide', rows: 18, spellcheck: false, style: 'font:12px ui-monospace,monospace;text-align:left' });
      ta.value = JSON.stringify(s.recipe, null, 2);
      const sv = h('button', { class: 'btn', type: 'button' }, 'Сохранить');
      sv.onclick = UI.busy(sv, async () => { const r = await UI.run(() => api('scripts/' + id + '/recipe', 'PUT', { recipe: ta.value }), 'Сохранено — утвердите снова'); if (r) { SV[id] = r; close(); UI.nav.refresh(); } });
      return h('div', { style: 'padding:0 var(--gutter) 20px' }, ta, h('div', { style: 'margin-top:12px' }, sv));
    });
    acts.push(edit);
    v.append(h('div', { class: 'actions' }, acts));
  }
  if (s.chat.length) {
    v.append(h('div', { class: 'group-h', style: 'margin:0 var(--gutter) 8px' }, 'Переписка с Gemini'));
    v.append(UI.chat(s.chat.map(m => ({ author: m.role === 'user' ? 'me' : 'ai', text: m.role === 'user' ? m.text : (m.show || ''), created: new Date((m.ts || 0) * 1000).toISOString() })), ['me'], { ai: 'Gemini' }));
  }
  if (a) v.append(UI.composer('Ответьте Gemini или попросите изменить рецепт', async text => {
    SV['busy' + id] = true; UI.nav.refresh();
    try { SV[id] = await api('scripts/' + id + '/chat', 'POST', { text }); } catch (e) { UI.alert(e.message); SV['busy' + id] = false; UI.nav.refresh(); return false; }
    SV['busy' + id] = false; UI.nav.refresh();
  }));
  v.append(group(null, [
    row({ title: 'Разобрать заново', cls: 'accent', onClick: async () => { if (await UI.ask({ title: 'Разобрать заново?', message: 'Переписка и рецепт будут заменены новым разбором.', buttons: [{ id: 'y', text: 'Разобрать' }] })) analyze(); } }),
    row({ title: 'Удалить скрипт', cls: 'destructive', onClick: async () => {
      if (!(await UI.ask({ title: 'Удалить скрипт?', message: 'Ноды, уже поставленные им, останутся.', buttons: [{ id: 'y', text: 'Удалить', type: 'destructive' }] }))) return;
      if (await UI.run(() => api('scripts/' + id, 'DELETE'), 'Удалён') !== undefined) { SCR = null; delete SV[id]; UI.nav.back(); }
    } })]));
  return v;
}
function geminiView() {
  return h('div', {}, ...title('Gemini'), ...settingsForm('Нейросеть для «Моих скриптов»', ['gemini_key', 'gemini_model', 'gemini_proxy'],
    'Ключ — Google AI Studio → Get API key. Модель пусто — бот возьмёт самую свежую pro-модель. Если сервер бота в стране, где Gemini недоступен, укажите прокси (например, через свою ноду). На ноды нейросеть доступа не получает: она только предлагает рецепт.',

  if (D.remark === undefined) D.remark = '{flag} {country} {n}';
  if (!D.tagTouched) D.tag = defTag;
  if (D.bremark === undefined) D.bremark = '{flag} {country}';
  if (D.tags === undefined || D.tagsMode !== D.hostMode) { D.tags = 'NORMAL'; D.tagsMode = D.hostMode; }
  const input = (val, ph, on, mono) => { const i = h('input', { type: 'text', placeholder: ph, autocapitalize: 'off', spellcheck: false, style: 'text-align:left' + (mono ? ';font-family:ui-monospace,monospace' : '') }); i.value = val; i.addEventListener('input', () => on(i.value)); return i; };
  const loc0 = L(one.loc);
  if (!D.lang) { try { D.lang = localStorage.getItem('remark_lang') || 'ru'; } catch (e) { D.lang = 'ru'; } }
  const countryOf = loc => { if (D.lang !== 'en') return loc.name; try { const c = loc.code.replace(/[^a-z]/gi, '').slice(0, 2).toUpperCase(); const n = new Intl.DisplayNames(['en'], { type: 'region' }).of(c); return n && n !== c ? n : loc.name; } catch (e) { return loc.name; } };
  const preview = tpl => (tpl || '').replace('{flag}', loc0.flag).replace('{country}', countryOf(loc0)).replace('{n}', '1').replace('{name}', one.loc + '1').replace('{domain}', one.loc + '1.' + (D.zone || 'example.com')).replace(/\s+/g, ' ').trim();
  const prevEl = h('div', { class: 'group-f' });
  const setPrev = () => { prevEl.textContent = 'Например: ' + preview(D.remark) + '. {flag} — флаг, {country} — страна, {n} — номер ноды, {name}, {domain}.'; };
  setPrev();
  const modes = [{ value: 'simple', label: 'Обычные' }, { value: 'balancer', label: 'По стране' }, { value: 'normal', label: 'Общий NORMAL' }];
  v.append(h('section', { class: 'group' }, h('div', { class: 'group-h' }, 'Хосты в панели'),
    h('div', { style: 'padding:0 12px 12px' }, UI.segmented(modes, D.hostMode, x => { D.hostMode = x; D.hostTouched = true; UI.nav.refresh(); })),
    h('div', { class: 'list' }, h('label', { class: 'field stack' }, h('label', {}, D.hostMode === 'balancer' ? 'Название хостов нод (скрытые)' : 'Название хоста'), input(D.remark, '{flag} {country} {n}', x => { D.remark = x; setPrev(); })),
      row({ title: 'Страна в названии', right: UI.segmented([{ value: 'ru', label: 'Русский' }, { value: 'en', label: 'English' }], D.lang,
        x => { D.lang = x; try { localStorage.setItem('remark_lang', x); } catch (e) {} setPrev(); }) })),
    prevEl));
  if (D.hostMode === 'normal') {
    v.append(group('Общий балансировщик', [h('label', { class: 'field stack' }, h('label', {}, 'Теги хостов'), input(D.tags, 'NORMAL', x => { D.tags = x; }, true))],
      'Хосты видимые, с тегом ' + (D.tags || 'NORMAL').toUpperCase() + ' — их подхватит ваш уже настроенный общий балансировщик. Шаблоны и хосты-балансировщики бот не создаёт.'));
  } else if (D.hostMode === 'balancer') {
    const bases = tpls.filter(t => t.balancer_tag);
    const tagsFor = multi ? D.items.map(i => i.loc.replace(/[^A-Za-z0-9_]/g, '').toUpperCase()) : [(D.tag || defTag).toUpperCase()];
    const existing = tagsFor.filter(t => tpls.some(x => x.balancer_tag === t));
    if (!D.btpl || !bases.some(t => t.uuid === D.btpl)) D.btpl = (tpls.find(t => t.balancer_tag === tagsFor[0]) || bases[0] || {}).uuid;
    const brows = [];
    if (!multi) brows.push(h('label', { class: 'field stack' }, h('label', {}, 'Тег балансировщика'), input(D.tag, defTag, x => { D.tag = x.toUpperCase(); D.tagTouched = true; }, true)));
    brows.push(h('label', { class: 'field stack' }, h('label', {}, 'Ещё теги хостов нод'), input(D.tags, 'NORMAL', x => { D.tags = x; }, true)),
      h('label', { class: 'field stack' }, h('label', {}, 'Название хоста-балансировщика'), input(D.bremark, '{flag} {country}', x => { D.bremark = x; })));
    if (bases.length > 1 && existing.length < tagsFor.length) brows.push(h('div', { style: 'padding:10px 12px' }, h('div', { class: 'group-h', style: 'margin:0 4px 8px' }, 'Копировать шаблон'),
      UI.chips(bases.map(t => ({ value: t.uuid, label: t.name })), D.btpl, x => { D.btpl = x; })));
    const fresh = tagsFor.filter(t => !existing.includes(t));
    let note = !D.meta ? '' : (existing.length ? `Уже есть: ${existing.join(', ')} — ноды добавятся туда. ` : '')
      + (fresh.length ? (bases.length ? `Создам: ${fresh.map(t => 'Balancer_' + t.toLowerCase()).join(', ')} копией шаблона и хост-балансировщик для каждого. ` : 'В панели нет Xray-шаблона с балансировщиком (remnawave.injectHosts) — создайте один вручную. ') : '');
    note += 'Хосты нод скрытые, теги: ' + (multi ? 'код страны' : tagsFor[0]) + ', ' + ((D.tags || '').toUpperCase() || '—') + '.';
    v.append(group(multi ? 'Балансировщики по странам' : 'Балансировщик', brows, note));
  }

  // дополнения на ноде
  if (!D.psi) { let saved = {}; try { saved = JSON.parse(localStorage.getItem('psiphon') || '{}'); } catch (e) {}
    D.psi = { enabled: false, region: saved.region || '', domains: saved.domains || 'google.com\ngoogleapis.com\ngstatic.com\ngoogleusercontent.com' }; }
  const savePsi = () => { try { localStorage.setItem('psiphon', JSON.stringify({ region: D.psi.region, domains: D.psi.domains })); } catch (e) {} };
  const prows = [row({ icon: 'globe', tile: '#5856D6', title: 'Psiphon', sub: 'выход для выбранных доменов',
    right: UI.toggle(D.psi.enabled, on => { D.psi.enabled = on; UI.nav.refresh(); }, 'Psiphon') })];
  let pnote = 'Ставится на ноду вместе с ней: SOCKS5 только для этого сервера, вотчдог сам меняет плохие выходы. Нужен, когда Google (Gemini, YouTube…) не пускает с адреса сервера.';
  if (D.psi.enabled) {
    const ta = h('textarea', { class: 'wide', rows: 4, spellcheck: false, autocapitalize: 'off', style: 'text-align:left;font-family:ui-monospace,monospace' });
    ta.value = D.psi.domains; ta.addEventListener('input', () => { D.psi.domains = ta.value; savePsi(); });
    prows.push(h('label', { class: 'field stack' }, h('label', {}, 'Страна выхода'), input(D.psi.region, 'авто — или DE, NL, FR…', x => { D.psi.region = x.toUpperCase(); savePsi(); }, true)),
      h('label', { class: 'field stack' }, h('label', {}, 'Домены через Psiphon'), ta));
    const own = prof.script && prof.script_profile === 'existing';
    const gp = own && D.meta ? (D.meta.profiles || []).find(x => x.uuid === prof.panel_profile_uuid) : null;
    pnote = own ? (gp && !gp.psiphon ? `⚠️ В профиле «${gp.name}» нет выхода psiphon-out — Psiphon встанет, но трафик в него не пойдёт. Добавьте в профиль outbound socks 172.17.0.1:1080 и правило для доменов.`
        : 'Группа ставит ноды своим скриптом в готовый профиль панели — бот его не меняет, выход psiphon-out в профиле нужен свой.')
      : 'Ноды с Psiphon попадут в общий профиль «NV Vision Psiphon»: в нём выход psiphon-out (172.17.0.1:1080) и правило для этих доменов (только TCP — UDP Psiphon не умеет). Профиль создаётся один раз; если он уже есть, правила берутся из него — менять их в панели.';
    const bad = D.items.filter(i => /^(ru|by)/i.test(i.loc));
    if (bad.length) pnote = `⚠️ ${bad.map(i => L(i.loc).name).join(', ')}: Psiphon не ставят на сервер в стране, из которой обходят блокировки — его трафик заметен и сам блокируется. ` + pnote;
  }
  v.append(group('Дополнительно на ноде', prows, pnote));

  // порядок хостов: текущий список панели, новые — блоками по локациям, их можно двигать
  if (D.meta && D.meta.hosts) {
    const locTok = D.items.map(i => '#' + i.loc);
    if (!D.order) D.order = D.meta.hosts.map(x => x.uuid);
    D.order = D.order.filter(t => t[0] !== '#' || locTok.includes(t));
    locTok.forEach(t => { if (!D.order.includes(t)) D.order.push(t); });
    if (D.sel && !D.order.includes(D.sel)) D.sel = null;
    const byId = Object.fromEntries(D.meta.hosts.map(x => [x.uuid, x]));
    const changed = () => { D.orderTouched = true; UI.haptic('select'); UI.nav.refresh(); };
    const move = (t, d) => { const i = D.order.indexOf(t), j = i + d; if (j < 0 || j >= D.order.length) return; [D.order[i], D.order[j]] = [D.order[j], D.order[i]]; changed(); };
    const putAfter = (t, after) => { D.order.splice(D.order.indexOf(t), 1); D.order.splice(after === null ? 0 : D.order.indexOf(after) + 1, 0, t); D.sel = null; changed(); };
    const numOf = (it, n) => { const d = (D.domains[it.loc] || [])[n - 1]; const m = d && d.split('.')[0].match(/(\d+)$/); return m ? m[1] : String(n); };
    const remarkOf = (it, n) => { const loc = L(it.loc), d = (D.domains[it.loc] || [])[n - 1] || it.loc + n + '.' + (D.zone || 'example.com');
      return (D.remark || '{flag} {country} {n}').replace('{flag}', loc.flag).replace('{country}', countryOf(loc)).replace('{n}', numOf(it, n))
        .replace('{name}', d.split('.')[0]).replace('{domain}', d).replace(/\s+/g, ' ').trim() || d; };
    const mini = (ic, label, on, flip, pressed) => h('button', { class: 'btn tinted small', type: 'button', 'aria-label': label, 'aria-pressed': pressed === undefined ? undefined : String(pressed),
      style: 'min-width:38px;padding:6px 8px' + (flip ? ';transform:scaleY(-1)' : ''), onclick: e => { e.stopPropagation(); on(); } }, icon(ic));
    const rows = [];
    if (D.sel) rows.push(row({ icon: 'arrowDown', tile: '#34C759', title: 'В самое начало', cls: 'accent', onClick: () => putAfter(D.sel, null) }));
    const isHost = t => t[0] !== '#';
    D.order.forEach((t, i) => {
      if (isHost(t)) {
        const x = byId[t];
        if (!x) return;
        const sub = [x.address, x.balancer ? 'балансировщик' : '', x.hidden ? 'скрытый' : '', x.disabled ? 'выключен' : '', (x.tags || []).join(' ')].filter(Boolean).join(' · ');
        const hr = row({ title: x.remark || x.address, sub, onClick: D.sel ? () => putAfter(D.sel, t) : null, chevron: false,
          right: D.sel ? h('span', { class: 'd' }, 'после него') : null });
        if (x.disabled || x.hidden) hr.style.opacity = '.62';
        rows.push(hr);
        return;
      }
      const it = D.items.find(x => '#' + x.loc === t);
      const names = it.count === 1 ? remarkOf(it, 1) : it.count === 2 ? remarkOf(it, 1) + ', ' + remarkOf(it, 2) : remarkOf(it, 1) + ' … ' + remarkOf(it, it.count);
      const bal = D.hostMode === 'balancer' ? ' + балансировщик, если его ещё нет' : '';
      const r = row({ cls: 'wrap', title: names, sub: `новые · ${it.count} ${UI.plural(it.count, 'хост', 'хоста', 'хостов')}${bal}`, chevron: false,
        right: h('div', { style: 'display:flex;gap:6px' },
          mini('arrowDown', 'Выше', () => move(t, -1), true), mini('arrowDown', 'Ниже', () => move(t, 1)),
          mini('stack', 'Выбрать место в списке', () => { D.sel = D.sel === t ? null : t; UI.haptic('select'); UI.nav.refresh(); }, false, D.sel === t)) });
      r.style.cssText += ';background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)';
      rows.push(r);
    });
    const box = h('div', { class: 'list', style: 'max-height:440px;overflow:auto' }, rows);
    const foot = D.sel ? 'Нажмите на хост — новые встанут сразу после него.'
      : (D.meta.hosts.length ? `В панели ${D.meta.hosts.length} ${UI.plural(D.meta.hosts.length, 'хост', 'хоста', 'хостов')}. ` : 'В панели пока нет хостов. ')
        + (D.orderTouched ? 'Новые встанут туда, где они сейчас в списке.' : 'По умолчанию новые идут в конец — двигайте стрелками или кнопкой выбора места.');
    v.append(h('section', { class: 'group' }, h('div', { class: 'group-h' }, 'Порядок хостов'), box,
      D.orderTouched ? h('button', { class: 'btn tinted small', type: 'button', style: 'margin:8px 16px 0', onclick: () => { D.order = null; D.orderTouched = false; D.sel = null; UI.nav.refresh(); } }, 'Сбросить — в конец') : null,
      h('div', { class: 'group-f' }, foot)));
  }

  // итог
  const per = D.cat.periods.find(p => p.code === D.period) || { months: 1, pct: 0 };
  const priceOf = it => { const o = L(it.loc).offers.find(x => x.idx === it.idx); return per.months <= 1 ? o.price_kop : Math.ceil(o.price_kop * per.months * (100 - per.pct) / 100 / 100) * 100; };
  const sum = D.items.reduce((s, it) => s + priceOf(it) * it.count, 0), bal = D.cat.balance_kop;
  const enough = bal === null || bal >= sum;
  v.append(h('section', { class: 'group' }, h('div', { class: 'group-h' }, 'Итого'), h('div', { class: 'list' },
    ...D.items.map(it => row({ title: `${L(it.loc).flag} ${L(it.loc).name} × ${it.count}`, detail: rubK(priceOf(it) * it.count) })),
    h('div', { class: 'total' }, h('span', {}, `${total} ${UI.plural(total, 'нода', 'ноды', 'нод')} · ${PERIOD[D.period]}`), h('b', {}, rubK(sum))),
    row({ title: 'Платит', detail: D.cat.buyer }),
    row({ title: 'Баланс', detail: bal === null ? '—' : rubK(bal), right: enough ? null : badge('Не хватает', 'bad') }),
    row({ title: 'Система', detail: D.cat.os_label }),
    row({ title: 'Traffic Control', detail: prof.traffic_control ? 'да' : 'нет' }))));
  const go = h('button', { class: 'btn', type: 'button', disabled: !enough || !D.picked }, icon('bolt'), 'Купить и установить');
  go.onclick = UI.busy(go, async () => {
    const ok = await UI.ask({ title: 'Купить и установить?', message: `${total} ${UI.plural(total, 'нода', 'ноды', 'нод')}, ${rubK(sum)} спишется с баланса: ${D.cat.buyer}.`, buttons: [{ id: 'y', text: 'Купить' }] });
    if (!ok) return;
    const items = D.items.map(it => ({ location: it.loc, idx: it.idx, domains: D.domains[it.loc] || [] }));
    const r = await UI.run(() => api('deploy', 'POST', { pid: prof.id, items, period: D.period,
      squads: D.squads ? [...D.squads] : undefined, remark: D.remark, host_mode: D.hostMode, tags: D.tags,
      balancer_tag: D.tag, balancer_remark: D.bremark, balancer_template: D.btpl || null, remark_lang: D.lang,
      host_order: D.orderTouched && D.order ? D.order : undefined,
      psiphon: D.psi && D.psi.enabled ? { enabled: true, region: D.psi.region, domains: D.psi.domains } : undefined }), 'Задачи запущены');
    if (!r) return;
    const gid = D.pid; D = null; delete GJ[gid]; await load(); UI.nav.reset(); UI.nav.push(() => groupView(gid));
  });

    h('div', { class: 'group-f', style: 'margin:8px 0 0' }, D.picked ? 'Ход установки — на странице группы, в «Задачах» и сообщениями в чате с ботом.' : 'Подберите или проверьте домены, чтобы продолжить.')));
  return v;
}

// ───────── задачи ─────────
let JOBS = null, jobTimer = null;
function poll(fn, ms) { clearTimeout(jobTimer); jobTimer = setTimeout(fn, ms); }
async function loadJobs() { try { JOBS = (await api('jobs')).jobs; } catch (e) { JOBS = { error: e.message }; } }
function jobsView() {
  if (JOBS === null) { loadJobs().then(() => UI.nav.refresh()); return h('div', {}, ...title('Задачи'), group(null, [h('div', { class: 'skeleton' })])); }
  if (JOBS.error) return h('div', {}, ...title('Задачи'), h('div', { class: 'notice' }, JOBS.error));
  if (JOBS.some(j => ['queued', 'buying', 'provisioning', 'deploying'].includes(j.status)))
    poll(async () => { if (!document.querySelector('#root .jobs-page')) return; await loadJobs(); UI.nav.refresh(); }, 4000);
  const v = h('div', { class: 'jobs-page' }, ...title('Задачи'));
  if (!JOBS.length) { v.append(h('div', { class: 'empty' }, icon('stack'), h('b', {}, 'Пока пусто'), 'Задачи появятся после первого развёртывания.')); return v; }
  v.append(group(null, JOBS.map(j => {
    const [st, cls] = STATUS[j.status] || [j.status, ''];
    const sub = j.status === 'failed' ? j.error : `${j.flag} ${j.loc_name} · ${j.status === 'deploying' ? (STAGE[j.stage] || j.spec) : j.spec}`;
    return row({ title: j.domain, sub: sub.slice(0, 110), right: badge(st, cls), onClick: () => { delete JOB[j.id]; UI.nav.push(() => jobView(j.id)); } });
  })));
  return v;
}
const JOB = {};
function jobView(id) {
  const j = JOB[id];
  const reload = async () => { try { JOB[id] = await api('jobs/' + id); } catch (e) { JOB[id] = { error: e.message }; } UI.nav.refresh(); };
  if (!j) { reload(); return h('div', {}, ...title('Задача', 'Задачи'), group(null, [h('div', { class: 'skeleton' })])); }
  if (j.error && !j.id) return h('div', {}, ...title('Задача', 'Задачи'), h('div', { class: 'notice' }, j.error));
  const active = ['queued', 'buying', 'provisioning', 'deploying'].includes(j.status);
  if (active) poll(() => { if (document.querySelector('#root .job-page')) reload(); }, 3000);
  const cur = j.stages.findIndex(s => s.code === j.stage);
  const v = h('div', { class: 'job-page' }, ...title(j.domain, 'Задачи'),
    h('div', { class: 'subtitle' }, `${j.flag} ${j.loc_name} · ${j.spec} · ${j.profile}`));
  v.append(group('Этапы', j.stages.map((s, i) => {
    const done = j.status === 'done' || i < cur, now = i === cur && !done;
    const mark = done ? h('i', { class: 'done' }, '✓') : now ? h('i', { class: j.status === 'failed' ? 'fail' : 'now' }, j.status === 'failed' ? '!' : '•') : h('i', {}, String(i + 1));
    return h('div', { class: 'row' }, h('div', { class: 'grow stage' }, mark, h('div', { class: 't' }, s.label)),
      s.code === 'ip' && j.ip && (done || j.status === 'done') ? h('span', { class: 'd mono' }, j.ip) : null);
  }), active && j.last ? j.last : null));
  if (j.status === 'failed') v.append(h('div', { class: 'notice', style: 'background:var(--danger-soft);color:var(--danger)' }, j.error));
  if (j.status === 'done') v.append(group('Доступ к серверу', [
    row({ title: 'IP', right: h('button', { class: 'btn plain small', type: 'button', onclick: () => UI.copy(j.ip, 'IP') }, h('span', { class: 'mono' }, j.ip)) }),
    row({ title: 'Пароль root', right: h('button', { class: 'btn plain small', type: 'button', onclick: () => UI.copy(j.password, 'Пароль') }, 'Скопировать') })]));
  const acts = [];
  if (j.status === 'failed') {
    const retry = h('button', { class: 'btn', type: 'button' }, icon('renew'), 'Повторить');
    retry.onclick = UI.busy(retry, async () => {
      if (!j.server_id && !(await UI.ask({ title: 'Повторить?', message: 'Сервер ещё не был куплен — повтор купит новый.', buttons: [{ id: 'y', text: 'Повторить' }] }))) return;
      if (await UI.run(() => api('jobs/' + id + '/retry', 'POST'), 'Запущено снова')) reload();
    });
    acts.push(retry);
  }
  if (!active) {
    const hide = h('button', { class: 'btn tinted', type: 'button' }, 'Скрыть');
    hide.onclick = UI.busy(hide, async () => { if (await UI.run(() => api('jobs/' + id + '/hide', 'POST'))) { JOBS = null; UI.nav.back(); } });
    acts.push(hide);
  }
  if (acts.length) v.append(h('div', { class: 'actions' }, acts));
  v.append(h('div', { class: 'group-h', style: 'margin:0 var(--gutter) 6px' }, 'Журнал'),
    j.log ? h('pre', { class: 'log' }, j.log.slice(-20000)) : h('div', { class: 'group-f', style: 'margin:0 var(--gutter) 30px' }, 'Журнал появится, когда начнётся установка.'));
  const pre = v.querySelector('.log'); if (pre) requestAnimationFrame(() => { pre.scrollTop = pre.scrollHeight; });
  return v;
}

let lastDepth = 0;
document.addEventListener('navchange', e => {
  const back = e.detail.depth === 0 && lastDepth > 0;
  lastDepth = e.detail.depth;
  if (back) { JOBS = null; D = null; for (const k in GJ) delete GJ[k]; load(); }
});
UI.nav.mount(document.getElementById('root'), home);
load();
</script>
