<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BobrNet</title>
<link rel="icon" href="/static/logo.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/ui.css">
<style>
  /* экраны админки — поверх ui.css; только то, чего нет в общих компонентах */
  .status-line { font-size: 13px; line-height: 18px; padding: 0 2px; margin: 8px 0 0; color: var(--hint); }
  .status-line:empty { display: none; }
  .status-line.ok { color: var(--ok); } .status-line.bad { color: var(--danger); }
  .list .status-line { padding: 0 16px 12px; margin: 0; }
  .actions { display: flex; gap: 8px; margin: 0 var(--gutter) var(--s5); }
  .actions .btn { flex: 1; }
  .pad { margin: 0 var(--gutter) var(--s5); }
  .pad .group-f { margin-top: 8px; }
  .notice { margin: 0 var(--gutter) var(--s4); padding: 12px 14px; border-radius: var(--r-md); background: var(--warn-soft); color: var(--text); font-size: 14px; line-height: 20px; overflow-wrap: anywhere; }
  .notice.bad { background: var(--danger-soft); } .notice.ok { background: var(--ok-soft); } .notice.info { background: var(--accent-soft); }
  .notice b { font-weight: 600; }
  .notice .btn { margin-top: 12px; }
  .log { margin: 0; padding: 12px 14px; background: var(--cell); box-shadow: inset 0 0 0 1px var(--line); border-radius: var(--r-group);
         font: 12px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 60vh; overflow: auto; color: var(--hint); }
  /* этапы установки: тонкая вертикальная шкала, у текущего шага — живая строка журнала */
  .rail { list-style: none; margin: 0; padding: 6px 0; }
  .rail li { position: relative; display: flex; gap: 12px; padding: 7px 16px 7px 16px; align-items: flex-start; }
  .rail li::before { content: ""; position: absolute; left: 21px; top: 0; bottom: 0; width: 1px; background: #343A43; }
  .rail li:first-child::before { top: 15px; } .rail li:last-child::before { bottom: calc(100% - 15px); }
  .rail i { position: relative; z-index: 1; width: 11px; height: 11px; margin-top: 4.5px; border-radius: 50%; flex: none; background: var(--cell); box-shadow: inset 0 0 0 1.5px var(--hint-2); }
  .rail .done i { background: var(--ok); box-shadow: none; }
  .rail .now i { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .rail .fail i { background: var(--danger); box-shadow: 0 0 0 4px var(--danger-soft); }
  .rail .label { flex: 1; min-width: 0; }
  .rail .todo .label { color: var(--hint); }
  .rail .now .label, .rail .fail .label { font-weight: 500; }
  .rail .live { display: block; margin-top: 2px; font: 12px/1.45 var(--mono); color: var(--hint); overflow-wrap: anywhere; }
  .rail .val { font: 13px var(--mono); color: var(--hint); }
  .offer[aria-pressed="true"] .t { color: var(--accent-text); }
  .offer .tick { width: 18px; height: 18px; color: var(--accent-text); }
  .total { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px; }
  .total b { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .domains { padding: 4px 16px 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .domains span { font: 12.5px var(--mono); padding: 4px 8px; border-radius: var(--r-xs); background: var(--surface-2); }
  .counter { display: flex; align-items: center; gap: 12px; padding: 8px 16px 12px; }
  .counter b { min-width: 28px; text-align: center; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .counter .btn { min-width: 40px; font-size: 18px; }
  .counter input { flex: 1; accent-color: var(--accent); }
  .order-new { background: var(--accent-soft) !important; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .grip { padding: 10px 2px 10px 12px; color: var(--accent-text); cursor: grab; touch-action: none; display: grid; place-items: center; }
  .fold-body .log { border-radius: 0; box-shadow: none; background: none; border-top: 1px solid var(--sep); max-height: 55vh; }
  .grip svg { width: 18px; height: 18px; }
  .counter { padding: 0; gap: 10px; }
  .counter .btn { min-width: 36px; height: 36px; padding: 0; font-size: 18px; border-radius: var(--r-xs); }
  .in-note { padding: 0 16px 12px; font-size: 13px; line-height: 18px; color: var(--hint); }
  .in-note .group-f { margin: 0; padding: 0; }
  .mini-h { font-size: 13px; color: var(--hint); margin: 0 4px 8px; }
  .seg-out { margin: 0 var(--gutter) var(--s3); }
  .scroll-list { max-height: 55vh; overflow: auto; overscroll-behavior: contain; }
  .field-ic { width: 18px; height: 18px; color: var(--hint-2); flex: none; }
  .subtitle.mono { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
  .field .opt { color: var(--hint-2); font-weight: 400; }
  .row.compact .grow { padding-top: 9px; padding-bottom: 9px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; padding: 12px 16px; font-size: 14px; }
  .kv dt { color: var(--hint); } .kv dd { margin: 0; text-align: right; min-width: 0; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/static/ui.js"></script>
<script src="/static/fx.js"></script>
<script>
UI.init();
const { h, row, group, icon } = UI;
const api = UI.api('/api/');
let ST = null, FIELDS = null;
const rubK = kop => UI.rub(Math.round((kop || 0) / 100));
const STATUS = { queued: ['В очереди', ''], buying: ['Покупка', 'accent'], provisioning: ['Создание сервера', 'accent'],
  deploying: ['Установка', 'accent'], done: ['Готово', 'ok'], failed: ['Ошибка', 'bad'] };
const STAGE = { buy: 'Покупка', ip: 'Создание сервера', dns: 'DNS', ssh: 'SSH', install: 'Установка ноды', extras: 'Дополнения', panel: 'Панель', check: 'Проверка' };
const badge = (text, cls) => h('span', { class: 'badge ' + (cls || '') }, text);
const statusLine = () => h('div', { class: 'status-line', role: 'status' });
function showStatus(el, r) { el.className = 'status-line ' + (r.ok ? 'ok' : 'bad'); el.textContent = r.message; UI.haptic(r.ok ? 'success' : 'error'); }
const isAdmin = () => !!ST && ST.role === 'admin';
// подпись группы в списках: чья она (у администратора — пользователя; у пользователя — от администратора)
const groupWho = p => p.kind === 'user' ? 'пользователя ' + (p.created_by_label || '') : p.kind === 'shared' ? 'от администратора' : '';

async function load() {
  const had = ST;
  try { ST = await api('state'); saveCache(); }
  catch (e) {
    // нет связи, а есть сохранённое — показываем его и говорим об этом, а не пустой экран
    if (had && !had.error && had._stale) { ST = had; UI.toast('Бот не ответил — показаны сохранённые данные', true); }
    else ST = { error: e.message, status: e.status };
  }
  if (ST.theme) applyTheme(ST.theme);
  UI.nav.refresh();
}
// ───────── последнее известное состояние: сразу при открытии, потом — свежее ─────────
const CACHE_KEY = 'bn:cache:' + (((UI.tg && UI.tg.initDataUnsafe && UI.tg.initDataUnsafe.user) || {}).id || 'web');
let cacheTimer = 0;
function saveCache() {
  clearTimeout(cacheTimer);
  cacheTimer = setTimeout(() => {
    if (!ST || ST.error) return;
    const nodes = {};
    for (const k in NODES) { const L = NODES[k]; if (L && !L.error && L.nodes) nodes[k] = { nodes: L.nodes, versions: L.versions, bot_key: L.bot_key }; }
    const wal = WAL && !WAL.error && WAL.balance_kop != null ? { ...WAL, _stale: undefined } : null;
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ v: 1, at: Date.now(), st: { ...ST, _stale: undefined }, nodes, wal })); } catch (e) {}
  }, 400);
}
function restoreCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (!c || c.v !== 1 || Date.now() - c.at > 7 * 86400e3 || !c.st) return;
    ST = { ...c.st, _stale: true };
    for (const k in c.nodes || {}) NODES[k] = { ...c.nodes[k], _stale: true };
    if (c.wal) WAL = { ...c.wal, _stale: true };
    if (ST.theme) applyTheme(ST.theme);
  } catch (e) {}
}
// список нод: нет — загрузить; сохранённый или старше минуты — обновить в фоне (новая нода появится сама)
const needsLoad = L => L === undefined || (!!L && !L.error && !L._loading && (!!L._stale || Date.now() - (L._at || 0) > 60000));
// оформление: фон и эффект перезапускаются, только если что-то поменялось
let themeKey = '';
function applyGlass(g) {
  const root = document.documentElement;
  root.style.setProperty('--glass', String((g || 0) / 100));
  root.classList.toggle('glass', g > 0);
}
function applyTheme(t) {
  applyGlass(t.glass);
  const key = [t.bg, t.image, t.effect].join('|');
  if (key === themeKey || !window.FX) return;
  themeKey = key;
  FX.background(t.bg, t.bg === 'image' ? t.image : null);
  if (UI.tg && UI.tg.platform === 'android') FX.intensity('low');  // меньше частиц: на слабых Android эффект мешал прокрутке
  FX.effect(t.effect);
}

// длинное значение — середина в многоточие: начало и конец домена важнее
const mid = (s, n = 34) => !s || s.length <= n ? s : s.slice(0, Math.ceil(n * .62)) + '…' + s.slice(-Math.floor(n * .38));
const specText = sp => (sp || '').replace(/ · /g, ', ');

// ───────── шапка экрана и меню действий ─────────
const inTG = () => { try { return !!(UI.tg && UI.tg.isVersionAtLeast('6.1')); } catch (e) { return false; } };
// «назад» — своя стрелка только вне Telegram (в Telegram — системная кнопка); «⋯» — действия экрана
function pageHead(t, o = {}) {  // не head: в Safari это имя занято элементом <head>
  const out = [];
  const back = UI.nav.stack.length > 0 && !inTG();
  const items = (o.menu || []).filter(Boolean);
  const menu = items.length ? h('button', { class: 'round-btn', type: 'button', 'aria-label': 'Действия', onclick: () => actionSheet(o.menuTitle || t, items) }, icon('more')) : null;
  if (back || menu || o.right) out.push(h('div', { class: 'appbar' },
    back ? h('button', { class: 'round-btn', type: 'button', 'aria-label': 'Назад', onclick: () => UI.nav.back() }, icon('arrowLeft')) : null,
    h('div', { class: 'sp' }), o.right || null, menu));
  out.push(h('div', { class: 'title-row' }, o.flag ? h('span', { class: 'flag-xl', 'aria-hidden': 'true' }, o.flag) : null, h('h1', { class: 'large-title' }, t)));
  if (o.sub) out.push(h('div', { class: 'subtitle' }, o.sub));
  return out;
}
const title = t => pageHead(t);
function actionSheet(t, items) {
  UI.sheet(t, close => h('div', { class: 'menu' }, group(null, items.map(i => row({ title: i.text, icon: i.icon, color: i.danger ? null : i.color, sub: i.sub,
    cls: i.danger ? 'destructive' : null, chevron: false, onClick: () => { close(); i.fn(); } })))));
}
// выбрать группу, если их несколько; одна — сразу она
function pickGroup(t, fn) {
  const ps = (ST && ST.profiles) || [];
  if (!ps.length) return UI.toast('Сначала создайте группу', true);
  if (ps.length === 1) return fn(ps[0].id);
  actionSheet(t, ps.map(p => ({ text: p.name, icon: 'servers', color: 'blue', fn: () => fn(p.id) })));
}
const svgEl = str => { const s = document.createElement('span'); s.innerHTML = str; return s.firstElementChild; };  // только для своих констант ниже
const BRAND = '<svg viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#4466F2"/><path d="M9 9.5 19 8.5M9 9.5l5 9.5M19 8.5 14 19" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".55"/><circle cx="9" cy="9.5" r="2.7" fill="#fff"/><circle cx="19" cy="8.5" r="2.7" fill="#fff"/><circle cx="14" cy="19" r="2.7" fill="#fff"/></svg>';
// картинка приветствия: времена года × день/ночь; «auto» — по календарю и часу на устройстве
const SEASONS = { spring: 'Весна', summer: 'Лето', autumn: 'Осень', winter: 'Зима' }, DAYPART = { day: 'день', night: 'ночь' };
const HEROES = Object.keys(SEASONS).flatMap(s => ['day', 'night'].map(t => `${s}-${t}`));
function heroNow(d = new Date()) {
  const m = d.getMonth(), hr = d.getHours();
  const season = m <= 1 || m === 11 ? 'winter' : m <= 4 ? 'spring' : m <= 7 ? 'summer' : 'autumn';
  return `${season}-${hr >= 7 && hr < 20 ? 'day' : 'night'}`;
}
const heroName = k => { const [s, t] = k.split('-'); return `${SEASONS[s]}, ${DAYPART[t]}`; };
const heroKey = () => { const h0 = (ST && ST.theme && ST.theme.hero) || 'auto'; return h0 === 'auto' ? heroNow() : h0; };
function heroImg(key, cls) {
  const img = h('img', { class: cls || null, src: `/static/hero-${key}.webp`, alt: '', decoding: 'async', draggable: 'false' });
  img.addEventListener('load', () => img.classList.add('in'), { once: true });
  if (img.complete) img.classList.add('in');
  return img;
}

// ───────── главная ─────────
function home() {
  const v = h('div', { class: 'home-page' }, h('div', { class: 'appbar' },
    h('span', { class: 'brand' }, h('img', { class: 'logo', src: '/static/logo.png', alt: '', width: 30, height: 30 }), h('span', { class: 'bt' }, 'Bobr', h('span', { class: 'net' }, 'Net'))), h('div', { class: 'sp' }), ST && !ST.error ? walletChip() : null, bellBtn()));
  if (!ST) {
    v.append(h('div', { 'aria-busy': 'true', 'aria-label': 'Загрузка' }, h('div', { class: 'hero skeleton', style: 'background-color:var(--cell)' }),
      h('div', { class: 'stats' }, [1, 2, 3].map(() => h('div', { class: 'stat skeleton', style: 'height:72px' }))),
      h('div', { class: 'group' }, UI.stack([h('div', { class: 'skeleton' }), h('div', { class: 'skeleton' })]))));
    return v;
  }
  if (ST.error) {
    v.append(ST.status === 403 ? h('div', { class: 'notice bad' }, h('b', {}, 'Нет доступа. '), ST.error)
      : UI.failed(ST.error, () => { ST = null; UI.nav.refresh(); load(); }, 'Бот не ответил'));
    return v;
  }
  warmNodes();
  const admin = isAdmin(), j = ST.jobs, NS = nodeStats();
  // приветствие и общее состояние: что требует внимания — словами, иначе «всё работает»
  const name = ST.me || (UI.tg && UI.tg.initDataUnsafe && UI.tg.initDataUnsafe.user && UI.tg.initDataUnsafe.user.first_name) || '';
  const bad = [];
  if (ST.issues.length) bad.push('нужна настройка');
  if (NS.off) bad.push(`без связи ${NS.off} ${UI.plural(NS.off, 'нода', 'ноды', 'нод')}`);
  if (j.failed) bad.push(`ошибок в задачах: ${j.failed}`);
  if (ST.host && ST.host.level === 'bad') bad.push('серверу бота не хватает ресурсов');
  const state = bad.length ? ['Внимание: ' + bad.join(', '), 'bad'] : j.active ? [`Идёт установка: ${j.active}`, 'run'] : NS.loading ? ['Проверяю панели…', ''] : ['Все системы работают', 'ok'];
  const hk = heroKey();
  v.append(h('div', { class: 'hero' + (hk === 'none' ? ' plain' : '') }, hk === 'none' ? null : h('div', { class: 'art' }, heroImg(hk)),
    h('h2', {}, name ? `Привет, ${name}!` : 'BobrNet'), h('span', { class: 'st ' + state[1], role: 'status' }, state[0])));
  const servers = ST.profiles.reduce((a, p) => a + (p.servers || 0), 0);
  v.append(h('div', { class: 'stats' },
    statTile(NS.nodes != null ? NS.nodes : servers, NS.nodes != null ? UI.plural(NS.nodes, 'нода', 'ноды', 'нод') : UI.plural(servers, 'сервер', 'сервера', 'серверов'), null, 'nodes'),
    statTile(ST.profiles.length, UI.plural(ST.profiles.length, 'группа', 'группы', 'групп'), null, 'groups'),
    statTile(NS.online != null ? NS.online : '—', 'онлайн', null, 'online')));
  if (ST.issues.length) v.append(h('div', { class: 'notice' }, h('b', {}, 'Чтобы начать: '), ST.issues.join(', ') + '.'));
  v.append(h('div', { class: 'cta' }, h('button', { class: 'btn', type: 'button', disabled: ST.issues.length > 0, onclick: () => { D = null; UI.nav.push(() => deployView()); } }, icon('plusCircle'), 'Развернуть ноды')));
  // группы: первые три, остальные — во вкладке «Серверы»
  const ps = ST.profiles;
  v.append(h('section', { class: 'group' }, h('div', { class: 'group-h' }, 'Мои группы',
    ps.length ? h('button', { class: 'more', type: 'button', onclick: () => UI.nav.setTab('servers') }, 'Все', icon('chevron')) : null),
    UI.stack(ps.length ? ps.slice(0, 3).map(groupCard) : [row({ icon: 'plus', color: 'blue', title: 'Новая группа', sub: 'панель Remnawave, домены и скрипт установки', onClick: () => openProfile(null) })])));
  // быстрые действия
  const qa = [
    ['Мониторинг', 'activity', 'blue', () => { MON = null; UI.nav.push(monitorView); }],
    ['Утренняя сводка', 'sun', 'amber', () => { SUM = null; UI.nav.push(summaryView); }],
    admin ? ['Мои скрипты', 'code', 'violet', () => { SCR = null; UI.nav.push(scriptsView); }] : ['Задачи', 'list', 'violet', () => { JOBS = null; UI.nav.push(jobsView); }, j.failed],
    ['Обновления', 'renew', 'teal', () => pickGroup('Обновление нод', pid => { delete NODES[pid]; UI.nav.push(() => nodesView(pid)); })],
    admin ? ['Пользователи', 'users', 'green', () => { USERS = null; UI.nav.push(usersView); }]
      : ps.length > 1 ? ['Перенос хостов', 'swap', 'green', () => { TX = null; UI.nav.push(transferView); }] : ['Новая группа', 'plus', 'green', () => openProfile(null)],
    ['Оформление', 'palette', 'pink', () => UI.nav.push(themeView)]];
  v.append(h('section', { class: 'group' }, h('div', { class: 'group-h' }, 'Быстрые действия'),
    h('div', { class: 'qa' }, qa.map(([t, ic, c, fn, n]) => h('button', { type: 'button', onclick: fn }, UI.tile(ic, c), t, n ? h('span', { class: 'pip' }, String(n)) : null)))));
  if (!admin) {
    v.append(h('div', { class: 'group-f', style: 'margin:0 var(--gutter) var(--s5)' }, 'Серверы покупаются с вашего баланса в Bobr Cloud, домены — вашим токеном Cloudflare. Чекеры мониторинга общие для всех пользователей бота.'));
    return v;
  }
  v.append(h('section', { class: 'group' }, h('div', { class: 'group-h' }, 'Статус сервисов',
    h('button', { class: 'more', type: 'button', onclick: () => UI.nav.setTab('settings') }, 'Настройки', icon('chevron'))), group(null, serviceRows()).lastChild));
  return v;
}
// ───────── кошелёк: баланс Bobr Cloud и пополнение ─────────
let WAL = null, walAt = 0;
let walLoading = false;
function loadWallet(force) {
  if (!force && WAL && !WAL.error && !WAL._stale && Date.now() - walAt < 60000) return;
  if (walLoading) return;
  walLoading = true;
  const had = WAL;
  if (!had || had.error) WAL = undefined;  // сохранённый баланс остаётся на месте, пока не придёт свежий
  api('wallet').then(r => { WAL = r; walAt = Date.now(); saveCache(); }).catch(e => { WAL = had && !had.error ? had : { error: e.message }; })
    .then(() => { walLoading = false; if (document.querySelector('#root .home-page, #root .wallet-page, #root .settings-page')) UI.nav.refresh(); });
}
const walletText = () => WAL && !WAL.error && WAL.balance_kop != null ? rubK(WAL.balance_kop) : WAL && WAL.error ? '—' : '…';
function walletChip() {
  if (WAL === null || (WAL && WAL._stale)) loadWallet();
  return h('button', { class: 'wallet-chip', type: 'button', 'aria-label': 'Баланс Bobr Cloud: ' + walletText() + '. Пополнить', onclick: () => UI.nav.push(walletView) },
    icon('wallet'), h('span', { class: 'num' }, walletText()));
}
// вернулись из оплаты в браузере — баланс мог измениться
document.addEventListener('visibilitychange', () => { if (!document.hidden && WAL && !WAL.error) loadWallet(true); });
const TOPUP = { amount: 1000, how: null, custom: '' };
function walletView() {
  if (WAL === null) loadWallet();
  const v = h('div', { class: 'wallet-page' }, ...pageHead('Баланс', { sub: 'Bobr Cloud · ' + (WAL && WAL.account ? WAL.account : 'ваш аккаунт'),
    menu: [{ text: 'Обновить баланс', icon: 'restart', color: 'blue', fn: () => loadWallet(true) }] }));
  if (!WAL) { v.append(h('div', { class: 'group' }, UI.stack([h('div', { class: 'skeleton', style: 'height:110px' })]))); return v; }
  if (WAL.error) { v.append(UI.failed(WAL.error, () => { WAL = null; UI.nav.refresh(); }, 'Баланс не загрузился')); return v; }

  if (j.error && !j.id) return h('div', {}, ...title('Задача', 'Задачи'), h('div', { class: 'notice bad' }, j.error));
  const active = ACTIVE_ST.includes(j.status);
  if (active) poll(() => { if (document.querySelector('#root .job-page')) reload(); }, 3000);
  const cur = j.stages.findIndex(s => s.code === j.stage);
  const v = h('div', { class: 'job-page' }, ...title(j.domain, 'Задачи'),
    h('div', { class: 'subtitle' }, [[j.flag, j.loc_name].filter(Boolean).join(' '), specText(j.spec), j.profile && 'группа ' + j.profile].filter(Boolean).join(', ')));
  if (j.status === 'failed') {
    const retry = h('button', { class: 'btn', type: 'button' }, 'Повторить');
    retry.onclick = UI.busy(retry, async () => {
      if (!j.server_id && !(await UI.ask({ title: 'Повторить?', message: 'Сервер ещё не был куплен — повтор купит новый.', buttons: [{ id: 'y', text: 'Повторить' }] }))) return;
      if (await UI.run(() => api('jobs/' + id + '/retry', 'POST'), 'Запущено снова')) reload();
    });
    // Bobr Cloud дважды не создал сервер — главное действие: другая конфигурация или локация
    const other = j.create_failed ? h('button', { class: 'btn', type: 'button', onclick: () => { D = null; DEPLOY_HINT = j.location || null; UI.nav.push(() => deployView(j.profile_id)); } },
      'Другая конфигурация или локация') : null;
    if (other) retry.className = 'btn tinted';
    v.append(h('div', { class: 'notice bad' }, h('b', {}, (j.stages[cur] || {}).label ? 'Остановилось на шаге «' + j.stages[cur].label + '». ' : 'Ошибка. '), j.error,
      other, other ? h('div', { style: 'height:8px' }) : null, retry));
  }
  if (j.status === 'done' && j.ip) v.append(group('Доступ', [
    row({ title: 'IP', detail: j.ip, mono: true, copy: j.ip, copyLabel: 'IP' }),
    j.password ? row({ title: 'Пароль root', detail: '••••••••••', copy: j.password, copyLabel: 'Пароль' }) : null].filter(Boolean)));
  const rail = h('ol', { class: 'rail' }, j.stages.map((s, i) => {
    const done = j.status === 'done' || i < cur, now = i === cur && !done;
    const cls = done ? 'done' : now ? (j.status === 'failed' ? 'fail' : 'now') : 'todo';
    return h('li', { class: cls }, h('i'), h('span', { class: 'label' }, s.label,
      now && active && j.last ? h('span', { class: 'live' }, String(j.last).replace(/^#{2,}\s*/, '')) : null),
      s.code === 'ip' && j.ip && done ? h('span', { class: 'val' }, j.ip) : null);
  }));
  v.append(group('Этапы', [rail]));
  // после установки: проходит ли нода проверку из России (чекеры мониторинга)
  const RU = { wait: ['проверяю', 'run'], ok: ['доступна', 'ok'], bad: ['не проходит', 'bad'], none: ['нет данных', 'quiet'] };
  if (j.status === 'done' && RU[j.ru_check]) {
    v.append(group(null, [row({ icon: 'activity', color: j.ru_check === 'bad' ? 'pink' : 'blue', title: 'Доступность из России', cls: 'wrap', chevron: false,
      sub: j.ru_note || (j.ru_check === 'wait' ? 'чекеры проверяют новую ноду, обычно 2–5 минут' : ''), status: RU[j.ru_check] })]));
    if (j.ru_check === 'wait') poll(() => { if (document.querySelector('#root .job-page')) reload(); }, 15000);
  }
  const lines = j.log ? j.log.split('\n').length : 0;
  if (j.log) {
    const [fb, fbox] = UI.fold({ title: 'Журнал', summary: lines + ' ' + UI.plural(lines, 'строка', 'строки', 'строк'), key: 'log', open: j.status === 'failed',
      body: () => { const pre = h('pre', { class: 'log flat' }, j.log.slice(-20000).replace(/^#{2,}\s*/gm, '')); requestAnimationFrame(() => { pre.scrollTop = pre.scrollHeight; }); return pre; } });
    v.append(group(null, [fb, fbox]));
  } else v.append(group(null, [row({ title: 'Журнал', detail: 'появится при установке', cls: 'is-dim' })]));
  if (!active) v.append(group(null, [row({ title: 'Скрыть из списка', cls: 'accent', onClick: async () => {
    if (await UI.run(() => api('jobs/' + id + '/hide', 'POST'))) { JOBS = null; UI.nav.back(); } } })]));
  return v;
}

let lastDepth = 0;
document.addEventListener('navchange', e => {
  const back = e.detail.depth === 0 && lastDepth > 0;
  lastDepth = e.detail.depth;
  if (back) { JOBS = null; D = null; for (const k in GJ) delete GJ[k]; load(); }
  // точка на разделах: ошибки в задачах — на «Инструментах», сервер бота не справляется — на «Настройках»
  if (ST && !ST.error) { UI.nav.pip('tools', ST.jobs.failed > 0); UI.nav.pip('settings', !!(ST.host && ST.host.level === 'bad') || ST.issues.length > 0); }
});
restoreCache();
UI.nav.mount(document.getElementById('root'), home, [
  { key: 'home', label: 'Главная', icon: 'home', root: home }, { key: 'servers', label: 'Серверы', icon: 'servers', root: serversView },
  { key: 'tools', label: 'Инструменты', icon: 'tools', root: toolsView }, { key: 'settings', label: 'Настройки', icon: 'gear', root: settingsTab }]);
load();
</script>
</body>
</html>
