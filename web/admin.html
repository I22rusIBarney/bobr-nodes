<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bobr Nodes</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/ui.css">
<style>
  /* экраны админки — поверх ui.css; только то, чего нет в общих компонентах */
  .status-line { font-size: 13px; line-height: 18px; padding: 0 2px; margin: 8px 0 0; color: var(--hint); }
  .status-line:empty { display: none; }
  .status-line.ok { color: var(--ok); } .status-line.bad { color: var(--danger); }
  .list .status-line { padding: 0 16px 12px; margin: 0; }
  .actions { display: flex; gap: 8px; margin: 0 var(--gutter) var(--s5); }
  .actions .btn { flex: 1; }
  .pad { margin: 0 var(--gutter) var(--s5); }
  .pad .group-f { margin-top: 8px; }
  .notice { margin: 0 var(--gutter) var(--s4); padding: 12px 14px; border-radius: var(--r-md); background: var(--warn-soft); color: var(--text); font-size: 14px; line-height: 20px; overflow-wrap: anywhere; }
  .notice.bad { background: var(--danger-soft); } .notice.ok { background: var(--ok-soft); } .notice.info { background: var(--accent-soft); }
  .notice b { font-weight: 600; }
  .notice .btn { margin-top: 12px; }
  .log { margin: 0; padding: 12px 14px; background: var(--cell); box-shadow: inset 0 0 0 1px var(--line); border-radius: var(--r-group);
         font: 12px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 60vh; overflow: auto; color: var(--hint); }
  /* этапы установки: тонкая вертикальная шкала, у текущего шага — живая строка журнала */
  .rail { list-style: none; margin: 0; padding: 6px 0; }
  .rail li { position: relative; display: flex; gap: 12px; padding: 7px 16px 7px 16px; align-items: flex-start; }
  .rail li::before { content: ""; position: absolute; left: 21px; top: 0; bottom: 0; width: 1px; background: #343A43; }
  .rail li:first-child::before { top: 15px; } .rail li:last-child::before { bottom: calc(100% - 15px); }
  .rail i { position: relative; z-index: 1; width: 11px; height: 11px; margin-top: 4.5px; border-radius: 50%; flex: none; background: var(--cell); box-shadow: inset 0 0 0 1.5px var(--hint-2); }
  .rail .done i { background: var(--ok); box-shadow: none; }
  .rail .now i { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .rail .fail i { background: var(--danger); box-shadow: 0 0 0 4px var(--danger-soft); }
  .rail .label { flex: 1; min-width: 0; }
  .rail .todo .label { color: var(--hint); }
  .rail .now .label, .rail .fail .label { font-weight: 500; }
  .rail .live { display: block; margin-top: 2px; font: 12px/1.45 var(--mono); color: var(--hint); overflow-wrap: anywhere; }
  .rail .val { font: 13px var(--mono); color: var(--hint); }
  .offer[aria-pressed="true"] .t { color: var(--accent-text); }
  .offer .tick { width: 18px; height: 18px; color: var(--accent-text); }
  .total { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px; }
  .total b { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .domains { padding: 4px 16px 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .domains span { font: 12.5px var(--mono); padding: 4px 8px; border-radius: var(--r-xs); background: var(--surface-2); }
  .counter { display: flex; align-items: center; gap: 12px; padding: 8px 16px 12px; }
  .counter b { min-width: 28px; text-align: center; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .counter .btn { min-width: 40px; font-size: 18px; }
  .counter input { flex: 1; accent-color: var(--accent); }
  .order-new { background: var(--accent-soft) !important; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .grip { padding: 10px 2px 10px 12px; color: var(--accent-text); cursor: grab; touch-action: none; display: grid; place-items: center; }
  .fold-body .log { border-radius: 0; box-shadow: none; background: none; border-top: 1px solid var(--sep); max-height: 55vh; }
  .grip svg { width: 18px; height: 18px; }
  .counter { padding: 0; gap: 10px; }
  .counter .btn { min-width: 36px; height: 32px; padding: 0; font-size: 18px; border-radius: var(--r-xs); }
  .in-note { padding: 0 16px 12px; font-size: 13px; line-height: 18px; color: var(--hint); }
  .in-note .group-f { margin: 0; padding: 0; }
  .mini-h { font-size: 13px; color: var(--hint); margin: 0 4px 8px; }
  .seg-out { margin: 0 var(--gutter) var(--s3); }
  .scroll-list { max-height: 55vh; overflow: auto; overscroll-behavior: contain; }
  .field-ic { width: 18px; height: 18px; color: var(--hint-2); flex: none; }
  .subtitle.mono { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
  .field .opt { color: var(--hint-2); font-weight: 400; }
  .row.compact .grow { padding-top: 9px; padding-bottom: 9px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; padding: 12px 16px; font-size: 14px; }
  .kv dt { color: var(--hint); } .kv dd { margin: 0; text-align: right; min-width: 0; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/static/ui.js"></script>
<script src="/static/fx.js"></script>
<script>
UI.init();
const { h, row, group, icon } = UI;
const api = UI.api('/api/');
let ST = null, FIELDS = null;
const rubK = kop => UI.rub(Math.round((kop || 0) / 100));
const STATUS = { queued: ['В очереди', ''], buying: ['Покупка', 'accent'], provisioning: ['Создание сервера', 'accent'],
  deploying: ['Установка', 'accent'], done: ['Готово', 'ok'], failed: ['Ошибка', 'bad'] };
const STAGE = { buy: 'Покупка', ip: 'Создание сервера', dns: 'DNS', ssh: 'SSH', install: 'Установка ноды', extras: 'Дополнения', panel: 'Панель', check: 'Проверка' };
const badge = (text, cls) => h('span', { class: 'badge ' + (cls || '') }, text);
const statusLine = () => h('div', { class: 'status-line', role: 'status' });
function showStatus(el, r) { el.className = 'status-line ' + (r.ok ? 'ok' : 'bad'); el.textContent = r.message; UI.haptic(r.ok ? 'success' : 'error'); }
const title = (t, back) => [UI.nav.backLink(back || 'Bobr Nodes'), h('h1', { class: 'large-title' }, t)];
const isAdmin = () => !!ST && ST.role === 'admin';
// подпись группы в списках: чья она (у администратора — пользователя; у пользователя — от администратора)
const groupWho = p => p.kind === 'user' ? 'пользователя ' + (p.created_by_label || '') : p.kind === 'shared' ? 'от администратора' : '';

async function load() {
  try { ST = await api('state'); } catch (e) { ST = { error: e.message }; }
  if (ST.theme) applyTheme(ST.theme);
  UI.nav.refresh();
}
// оформление: фон и эффект перезапускаются, только если что-то поменялось
let themeKey = '';
function applyGlass(g) {
  const root = document.documentElement;
  root.style.setProperty('--glass', String((g || 0) / 100));
  root.classList.toggle('glass', g > 0);
}
function applyTheme(t) {
  applyGlass(t.glass);
  const key = [t.bg, t.image, t.effect].join('|');
  if (key === themeKey || !window.FX) return;
  themeKey = key;
  FX.background(t.bg, t.bg === 'image' ? t.image : null);
  FX.effect(t.effect);
}

// длинное значение — середина в многоточие: начало и конец домена важнее
const mid = (s, n = 34) => !s || s.length <= n ? s : s.slice(0, Math.ceil(n * .62)) + '…' + s.slice(-Math.floor(n * .38));
const specText = sp => (sp || '').replace(/ · /g, ', ');

// ───────── главная ─────────
function home() {
  if (!ST) return h('div', {}, h('h1', { class: 'large-title' }, 'Bobr Nodes'), group(null, [h('div', { class: 'skeleton' }), h('div', { class: 'skeleton' })]));
  if (ST.error) return h('div', {}, h('h1', { class: 'large-title' }, 'Bobr Nodes'), h('div', { class: 'notice bad' }, h('b', {}, 'Нет доступа. '), ST.error));
  const s = ST.settings, j = ST.jobs, admin = isAdmin();
  const v = h('div', {}, h('h1', { class: 'large-title' }, 'Bobr Nodes'));
  if (ST.issues.length) v.append(h('div', { class: 'notice' }, h('b', {}, 'Чтобы начать: '), ST.issues.join(', ') + '.'));
  v.append(h('div', { class: 'pad' }, h('button', { class: 'btn', type: 'button', disabled: ST.issues.length > 0, onclick: () => { D = null; UI.nav.push(() => deployView()); } }, 'Развернуть ноды')));
  v.append(group(['Группы', h('span', { class: 'n' }, ST.profiles.length || '')], [
    ...ST.profiles.map(p => row({ title: p.name,
      sub: [p.servers + ' ' + UI.plural(p.servers, 'сервер', 'сервера', 'серверов'), groupWho(p), admin ? p.owner_label : '', p.script].filter(Boolean).join(', '),
      status: p.active ? ['в работе: ' + p.active, 'run'] : p.failed ? ['ошибок: ' + p.failed, 'bad'] : null,
      onClick: () => UI.nav.push(() => groupView(p.id)) })),
    row({ title: 'Новая группа', cls: 'accent', onClick: () => openProfile(null) })]));
  const jobsStatus = j.active ? ['в работе: ' + j.active, 'run'] : j.failed ? ['ошибок: ' + j.failed, 'bad'] : null;
  v.append(group(null, [
    row({ title: 'Задачи', status: jobsStatus, detail: jobsStatus ? null : String(j.done || ''), onClick: () => UI.nav.push(jobsView) }),
    row({ title: 'Мониторинг', sub: 'доступность нод из России', onClick: () => { MON = null; UI.nav.push(monitorView); } }),
    admin ? row({ title: 'Мои скрипты', onClick: () => { SCR = null; UI.nav.push(scriptsView); } }) : null,
    admin || ST.profiles.length > 1 ? row({ title: 'Перенос хостов', onClick: () => { TX = null; UI.nav.push(transferView); } }) : null,
    admin ? row({ title: 'Пользователи', detail: ST.users ? String(ST.users) : null, onClick: () => { USERS = null; UI.nav.push(usersView); } }) : null,
    row({ title: 'Оформление', detail: ST.theme && window.FX ? FX.EFFECT_NAMES[ST.theme.effect === 'auto' ? FX.seasonal(new Date()) : ST.theme.effect] : null, onClick: () => UI.nav.push(themeView) })].filter(Boolean)));
  if (!admin) {
    v.append(h('div', { class: 'pad' }, h('div', { class: 'group-f' }, 'Серверы покупаются с вашего баланса в Bobr Cloud. Свою панель добавьте как новую группу — с вашим токеном Cloudflare. Чекеры в «Мониторинге» общие: ваш чекер проверяет ноды всех пользователей бота.')));
    return v;
  }
  const sec = ST.security || {}, hd = sec.hardened;
  const ok = k => s[k] && s[k].set;
  const conn = (set, off) => set ? ['', 'ok', 'подключён'] : off === undefined ? ['не настроен', 'bad'] : off;  // настроено — тихо, цветом только то, что требует внимания
  v.append(group('Сервер бота', [
    row({ title: 'Безопасность', status: hd ? (hd.password_login ? ['вход по паролю', 'warn'] : ['', 'ok', 'защищён']) : ['не защищён', 'bad'], onClick: () => UI.nav.push(securityView) }),
    row({ title: 'Bobr Cloud', status: conn(ok('bcloud_url') && ok('bcloud_token')), onClick: () => UI.nav.push(bcloudView) }),
    row({ title: 'Cloudflare', status: conn(ok('cf_token')), onClick: () => UI.nav.push(cfView) }),
    row({ title: 'Gemini', status: conn(ok('gemini_key'), null), detail: ok('gemini_key') ? null : 'не задан', onClick: () => UI.nav.push(geminiView) }),
    row({ title: 'SSH-ключ и очередь', detail: 'по ' + (s.parallel.value || 3), onClick: () => UI.nav.push(otherView) })]));
  return v;
}

// ───────── оформление ─────────
function themeView() {
  const t = ST.theme;
  const v = h('div', {}, ...title('Оформление'), h('div', { class: 'subtitle' }, 'Только для вас: у других пользователей бота оформление своё.'));
  if (!window.FX) { v.append(h('div', { class: 'notice bad' }, 'Не загрузился модуль оформления. Обновите страницу.')); return v; }
  const save = async patch => {
    const r = await UI.run(() => api('theme', 'POST', patch));
    if (r) { ST.theme = r; applyTheme(r); UI.haptic('select'); UI.nav.refresh(); }
  };
  const file = h('input', { type: 'file', accept: 'image/jpeg,image/png,image/webp', hidden: true });
  file.onchange = async () => {
    const f = file.files[0]; file.value = '';
    if (!f) return;
    if (f.size > 4 * 1024 * 1024) { UI.alert('Картинка больше 4 МБ. Уменьшите её и загрузите снова.'); return; }
    const r = await UI.run(async () => {
      const res = await fetch('/api/theme/background', { method: 'PUT', headers: { 'X-Init-Data': UI.initData(), 'Content-Type': f.type || 'application/octet-stream' }, body: f });
      let j = null; try { j = await res.json(); } catch (e) {}
      if (!res.ok) throw new Error(UI.errText(j, res.status));
      return j;
    }, 'Картинка загружена');
    if (r) { ST.theme = r; applyTheme(r); UI.nav.refresh(); }
  };
  const sw = k => k === 'image' ? (t.image ? `center / cover url("${t.image}")` : 'var(--surface-2)') : k === 'none' ? 'var(--bg)' : FX.BACKGROUNDS[k].dark;
  const tiles = [...Object.keys(FX.BACKGROUNDS), 'image'].map(k => h('button', { class: 'tile', type: 'button', 'aria-pressed': String(t.bg === k),
    onclick: () => { if (k === 'image' && !t.image) file.click(); else if (t.bg !== k) save({ bg: k }); } },
    h('span', { class: 'sw', style: 'background:' + sw(k) }, k === 'image' && !t.image ? h('span', { class: 'plus' }, icon('plus')) : null), FX.BG_NAMES[k]));
  v.append(h('div', { class: 'group-h' }, 'Фон'), h('div', { class: 'tiles' }, tiles), file);
  if (t.image) v.append(group(null, [
    act('Заменить картинку', () => file.click()),
    act('Удалить картинку', async () => { const r = await UI.run(() => api('theme/background', 'DELETE'), 'Картинка удалена'); if (r) { ST.theme = r; applyTheme(r); UI.nav.refresh(); } }, 'destructive')],
    'JPG, PNG или WebP до 4 МБ. Поверх картинки — лёгкое затемнение, чтобы текст читался.'));
  // прозрачность списков: двигается вживую, сохраняется, когда палец отпущен
  const val = h('b', {}, (t.glass || 0) + '%');
  const rng = h('input', { type: 'range', min: 0, max: 80, step: 5, value: t.glass || 0, 'aria-label': 'Прозрачность полей' });
  rng.addEventListener('input', () => { val.textContent = rng.value + '%'; applyGlass(+rng.value); });
  rng.addEventListener('change', async () => {
    const g = +rng.value;
    try { ST.theme = await api('theme', 'POST', { glass: g }); UI.haptic('select'); } catch (e) { UI.toast(e.message, true); applyGlass(t.glass); rng.value = t.glass; val.textContent = t.glass + '%'; }
  });
  v.append(group('Прозрачность полей', [h('div', { class: 'range-row' }, rng, val)],
    'Насколько сквозь списки виден фон и эффекты; под прозрачными полями фон размывается, чтобы текст читался.'));
  const now = t.effect === 'auto' ? FX.seasonal(new Date()) : t.effect;
  v.append(group('Эффект', Object.keys(FX.EFFECT_NAMES).map(k => row({ title: FX.EFFECT_NAMES[k], cls: 'wrap', chevron: false,
    sub: k === 'auto' ? 'Новый год 15.12–14.01, Хэллоуин 24.10–01.11, 14 февраля, 8 марта, снег зимой, листопад осенью' : null,
    right: t.effect === k ? icon('check', 'check') : null, onClick: () => { if (t.effect !== k) save({ effect: k }); } })),
    `Сейчас: ${FX.EFFECT_NAMES[now].toLowerCase()}. Эффекты не мешают нажатиям и выключаются, если в системе включено «Уменьшение движения».`));
  return v;
}

// ───────── настройки ─────────
function settingField(key, opts = {}) {
  const st = ST.settings[key];
  const i = opts.area ? h('textarea', { rows: 3, placeholder: opts.ph || '', spellcheck: false, style: 'text-align:left' })
    : h('input', { type: st.secret ? 'password' : (opts.type || 'text'), inputmode: opts.inputmode, autocomplete: 'off', autocapitalize: 'off', spellcheck: false,
      placeholder: st.secret && st.set ? 'оставить ' + st.hint : (opts.ph || '') });
  i.value = st.secret ? '' : (st.value || '');
  if (/url|proxy|pubkey|tg_id|parallel/.test(key)) i.classList.add('code');
  return [i, h('label', { class: 'field stack' }, h('label', {}, st.label), i)];
}
function settingsForm(header, keys, footer, check, opts = {}) {
  const fields = keys.map(k => [k, ...settingField(k, (opts.fields || {})[k] || {})]);
  const status = statusLine();
  const save = h('button', { class: 'btn', type: 'button' }, 'Сохранить');
  save.onclick = UI.busy(save, async () => {
    const values = Object.fromEntries(fields.map(([k, i]) => [k, i.value]));
    const r = await UI.run(() => api('settings', 'POST', { values }));
    if (!r) return;
    ST.settings = r.settings; ST.issues = r.issues;
    fields.forEach(([k, i]) => { if (ST.settings[k].secret) { i.value = ''; i.placeholder = 'оставить ' + ST.settings[k].hint; } });
    if (check) showStatus(status, await api(check, 'POST')); else UI.toast('Сохранено');
  });
  const test = check ? h('button', { class: 'btn tinted', type: 'button' }, 'Проверить') : null;
  if (test) test.onclick = UI.busy(test, async () => { const r = await UI.run(() => api(check, 'POST')); if (r) showStatus(status, r); });
  return [h('section', { class: 'group' }, h('div', { class: 'group-h' }, header), h('div', { class: 'list' }, fields.map(f => f[2])),
    footer ? h('div', { class: 'group-f' }, footer) : null, status), h('div', { class: 'actions' }, test, save)];
}
function bcloudView() {
  return h('div', {}, ...title('Bobr Cloud'), ...settingsForm('Подключение', ['bcloud_url', 'bcloud_token', 'bcloud_tg_id'],
    h('span', {}, 'Токен и адрес покажет команда ', h('span', { class: 'mono' }, 'bcloud api-token'), ' на сервере Bobr Cloud. Покупки идут с баланса указанного аккаунта — он должен быть в ADMIN_IDS Bobr Cloud.'),
    'check/bcloud', { fields: { bcloud_url: { ph: 'https://bobr-cloud.online' }, bcloud_tg_id: { inputmode: 'numeric' } } }));
}
function cfView() {
  return h('div', {}, ...title('Cloudflare'), ...settingsForm('API-токен', ['cf_token'],
    'Cloudflare → My Profile → API Tokens → Create Token. Права: Zone → DNS → Edit и Zone → Zone → Read, для зон с доменами нод. Если зоны профиля в другом аккаунте — задайте токен в самом профиле.', 'check/cloudflare'));
}
function otherView() {
  return h('div', {}, ...title('SSH-ключ и очередь'), ...settingsForm('Доступ и скорость', ['ssh_pubkey', 'parallel'],
    'Публичный ключ (содержимое .pub) добавляется на каждый новый сервер — входить можно будет без пароля. Пусто или «-» — не добавлять. Параллельно ставится не больше указанного числа нод, остальные ждут в очереди.',
    null, { fields: { ssh_pubkey: { area: true, ph: 'ssh-ed25519 AAAA… me@laptop' }, parallel: { inputmode: 'numeric' } } }));
}

// ───────── мониторинг: чекеры в России, подписки групп, починка ─────────
let MON = null, monTimer = 0;
const MONF = {};  // несохранённые настройки мониторинга групп
const CKF = {};  // несохранённый доступ по SSH на странице чекера
const MST = { ok: ['', 'ok', 'доступна'], down: ['недоступна', 'bad'], repairing: ['чиню', 'run'], gave_up: ['не починилась', 'bad'],
  ignored: ['не трогаю', 'warn'], replaced: ['заменена', ''] };
const CST = { new: ['…', ''], installing: ['ставлю', 'run'], running: ['', 'ok', 'работает'], idle: ['нет подписок', 'warn'], failed: ['ошибка', 'bad'] };
const cst = c => c.status === 'idle' && MON.groups.some(g => g.enabled) ? ['подписки — при опросе', 'warn'] : (CST[c.status] || [c.status, '']);
async function loadMon() { try { MON = await api('monitor'); } catch (e) { MON = { error: e.message }; } }
function monPoll() {  // пока ставится чекер или идёт починка — обновляем страницу
  clearTimeout(monTimer);
  const busy = MON && !MON.error && (MON.checkers.some(c => ['new', 'installing'].includes(c.status)) || MON.groups.some(g => g.nodes.some(n => n.status === 'repairing')));
  if (busy) monTimer = setTimeout(() => { if (document.querySelector('#root .mon-page')) loadMon().then(() => UI.nav.refresh()); }, 4000);
}
const ago = ts => { if (!ts) return 'ещё не было'; const m = Math.round((Date.now() / 1000 - ts) / 60); return m < 1 ? 'только что' : m < 60 ? m + ' мин назад' : Math.round(m / 60) + ' ч назад'; };
function monitorView() {
  if (MON === null) { loadMon().then(() => UI.nav.refresh()); return h('div', {}, ...title('Мониторинг'), group(null, [h('div', { class: 'skeleton' }), h('div', { class: 'skeleton' })])); }
  const v = h('div', { class: 'mon-page' }, ...title('Мониторинг'),
    h('div', { class: 'subtitle' }, 'Чекеры на серверах в России проверяют подписки групп. Нода недоступна, если её не пропускает большинство чекеров 3 проверки подряд (~15 мин).'));

// ───────── доступ по SSH: пароль, свой ключ, ключ бота (можно ключ + пароль), не-root — через sudo ─────────
function sshState(view) { view = view || {}; return { user: view.user || 'root', port: String(view.port || 22), password: '', key: view.key || '', key_text: '', sudo_password: '' }; }
function sshFields(F, view, botKey) {
  // поля создаются один раз; при смене пользователя или ключа перерисовывается только нижняя часть —
  // перерисовка страницы сбросила бы введённое и сняла фокус с поля
  view = view || {};
  const pwIn = (ph, k) => { const i = h('input', { type: 'password', autocomplete: 'off', placeholder: ph }); i.value = F[k] || ''; i.addEventListener('input', () => { F[k] = i.value; }); return i; };
  const more = h('div');
  const isRoot = () => !F.user || F.user === 'root';
  const draw = () => {
    const out = [];
    if (F.key === 'own') {
      const ta = h('textarea', { class: 'code', rows: 5, spellcheck: false, autocapitalize: 'off', placeholder: view.has_key && view.key === 'own' ? 'сохранён — вставьте новый, чтобы заменить' : '-----BEGIN OPENSSH PRIVATE KEY-----\n…\n-----END OPENSSH PRIVATE KEY-----', style: 'text-align:left' });
      ta.value = F.key_text; ta.addEventListener('input', () => { F.key_text = ta.value; fileNote.textContent = ''; });
      // файл ключа (id_ed25519, key.pem…) читается здесь же, на устройстве, и попадает в поле — как вставка
      const fileNote = h('div', { class: 'in-note' });
      const file = h('input', { type: 'file', style: 'display:none' });
      file.addEventListener('change', () => {
        const fl = file.files && file.files[0];
        file.value = '';
        if (!fl) return;
        if (fl.size > 32 * 1024) { UI.toast('Это не похоже на файл ключа: больше 32 КБ', true); return; }
        const rd = new FileReader();
        rd.onload = () => {
          const t = String(rd.result || '');
          if (/PuTTY-User-Key-File/.test(t)) { UI.toast('Это ключ PuTTY (.ppk) — сохраните его в PuTTYgen как OpenSSH key', true); return; }
          if (!/-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----/.test(t)) { UI.toast(/^ssh-|^ecdsa-/.test(t.trim()) ? 'Это публичный ключ (.pub) — нужен закрытый, без .pub' : 'В файле нет закрытого ключа', true); return; }
          F.key_text = t; ta.value = t; fileNote.textContent = 'Загружен ' + fl.name + '. Сохраните, чтобы бот его запомнил.'; UI.haptic('success');
        };
        rd.onerror = () => UI.toast('Не удалось прочитать файл', true);
        rd.readAsText(fl);
      });
      out.push(h('label', { class: 'field stack' }, h('label', {}, 'Закрытый ключ'), ta),
        act('Загрузить файл ключа', () => file.click()), file, fileNote);
    }
    if (F.key === 'bot') out.push(row({ cls: 'wrap', title: 'Ключ бота', sub: h('span', { class: 'mono', style: 'word-break:break-all' }, botKey || 'ssh-keygen недоступен'), copy: botKey || null, copyLabel: 'Ключ' }));
    if (!isRoot()) out.push(h('label', { class: 'field' }, h('label', {}, 'Пароль sudo'), pwIn(view.has_sudo_password ? 'сохранён' : 'как пароль SSH', 'sudo_password')));
    out.push(h('div', { class: 'in-note' }, 'Можно пароль, ключ или оба сразу — если сервер требует и то, и другое (Сбер Клауд). '
      + (isRoot() ? 'Под root — без sudo.' : `Вход под ${F.user}, команды — через sudo.`)
      + (F.key === 'own' ? ' Ключ без парольной фразы; хранится на сервере бота файлом с доступом только для root.' : '')
      + (F.key === 'bot' ? ` Добавьте ключ бота в ~/.ssh/authorized_keys пользователя ${F.user || 'root'}.` : '')));
    more.replaceChildren(...out);
  };
  const user = h('input', { type: 'text', class: 'code', placeholder: 'root', autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: false, style: 'text-align:right' });
  user.value = F.user;
  user.addEventListener('input', () => { const was = isRoot(); F.user = user.value.trim(); if (was !== isRoot()) draw(); else more.lastChild && (more.lastChild.textContent = more.lastChild.textContent.replace(/Вход под \S+,/, `Вход под ${F.user},`)); });
  const port = h('input', { type: 'text', class: 'code', inputmode: 'numeric', placeholder: '22', autocomplete: 'off', style: 'text-align:right' });
  port.value = F.port;
  port.addEventListener('input', () => { F.port = port.value.replace(/\D/g, ''); });
  draw();
  return [
    h('label', { class: 'field' }, h('label', {}, 'Пользователь'), user),
    h('label', { class: 'field' }, h('label', {}, 'Порт'), port),
    h('label', { class: 'field' }, h('label', {}, 'Пароль'), pwIn(view.has_password ? 'сохранён («-» — убрать)' : 'если нужен', 'password')),
    h('div', { class: 'seg-row' }, h('div', { class: 'mini-h' }, 'Ключ'), UI.segmented([{ value: '', label: 'Без ключа' }, { value: 'own', label: 'Свой' }, { value: 'bot', label: 'Ключ бота' }], F.key, x => { F.key = x; draw(); })),
    more];
}

      }, { passive: false });
      el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
      el.addEventListener('contextmenu', e => e.preventDefault());
      handle.addEventListener('mousedown', e => {  // мышью — за ≡
        e.preventDefault(); lastY = e.clientY; begin();
        const mv = ev => { lastY = ev.clientY; place(); };
        const up = () => { window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); end(); };
        window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
      });
    };
    const draw = () => {
      const st = box.scrollTop;
      box.replaceChildren();
      D.order.forEach(t => {
        if (t[0] !== '#') {
          const x = byId[t];
          if (!x) return;
          const sub = [mid(x.address, 28), x.balancer ? 'балансировщик' : '', x.hidden ? 'скрытый' : '', x.disabled ? 'выключен' : '', (x.tags || []).join(' ')].filter(Boolean).join(', ');
          const hr = row({ title: x.remark || x.address, sub, chevron: false, cls: 'compact' + (x.disabled || x.hidden ? ' is-dim' : '') });
          hr.dataset.tok = t;
          box.append(hr);
          return;
        }
        const it = D.items.find(x => '#' + x.loc === t);
        const names = it.count === 1 ? remarkOf(it, 1) : it.count === 2 ? remarkOf(it, 1) + ', ' + remarkOf(it, 2) : remarkOf(it, 1) + ' … ' + remarkOf(it, it.count);
        const bal = D.hostMode === 'balancer' ? ' + балансировщик, если его ещё нет' : '';
        const handle = h('span', { class: 'grip', 'aria-label': 'Перетащить' }, icon('grip'));
        const r = row({ cls: 'wrap order-new', title: names, sub: `новые, ${it.count} ${UI.plural(it.count, 'хост', 'хоста', 'хостов')}${bal}`, chevron: false, right: handle });
        r.dataset.tok = t;
        sortable(r, handle);
        box.append(r);
      });
      box.scrollTop = st;
      status();
    };
    function resetOrder() { D.orderTouched = false; D.order = D.meta.hosts.map(x => x.uuid).concat(locTok); draw(); box.scrollTop = box.scrollHeight; }
    draw();
    const after = (() => { const i = D.order.findIndex(t => t[0] === '#'); const prev = D.order.slice(0, i).reverse().find(t => byId[t]); return prev ? byId[prev] : null; })();
    const [ob, obox] = UI.fold({ title: 'Порядок хостов', summary: !D.orderTouched ? 'новые — в конец' : after ? 'новые после ' + (after.remark || after.address) : 'новые — в начало', key: 'd-order',
      body: [box, h('div', { class: 'in-note' }, footEl), resetBtn] });
    ob.addEventListener('click', () => requestAnimationFrame(() => { box.scrollTop = D.orderScroll != null ? D.orderScroll : box.scrollHeight; }));
    adv.push(ob, obox);
    box.addEventListener('scroll', () => { D.orderScroll = box.scrollTop; }, { passive: true });
    // прокрутка списка переживает перерисовку страницы; в первый раз показываем конец, где стоят новые
    requestAnimationFrame(() => { box.scrollTop = D.orderScroll != null ? D.orderScroll : box.scrollHeight; });
  }
  v.append(group('Настройки', adv));
  if (pwarn) v.append(h('div', { class: 'notice' }, pwarn));

  // итог
  const per = own ? null : (D.cat.periods.find(p => p.code === D.period) || { months: 1, pct: 0 });
  const priceOf = it => { const m = it.idx === 'custom' ? it.q.price_kop : L(it.loc).offers.find(x => x.idx === it.idx).price_kop;
    return per.months <= 1 ? m : Math.ceil(m * per.months * (100 - per.pct) / 100 / 100) * 100; };
  const sum = own ? 0 : D.items.reduce((s, it) => s + priceOf(it) * it.count, 0), bal = own ? null : D.cat.balance_kop;
  const enough = bal === null || bal >= sum;
  const nodesWord = `${total} ${UI.plural(total, 'нода', 'ноды', 'нод')}`;
  if (own) {
    const pairs = D.items.flatMap(it => it.servers.map((id, k) => [D.own.find(x => x.id === id), (D.domains[it.loc] || [])[k]]));
    v.append(group('Итого', [
      ...pairs.map(([x, dom]) => row({ title: `${x.flag || ''} ${x.name || x.ip}`.trim(), sub: x.ip, detail: dom ? mid(dom, 26) : '…', mono: !!dom })),
      h('div', { class: 'total' }, h('span', {}, nodesWord), h('b', {}, 'без покупки')),
      row({ title: 'Серверы', detail: D.ownBuyer }),
      row({ title: 'Traffic Control', detail: prof.traffic_control ? 'включён' : 'выключен' })]));
  } else v.append(h('section', { class: 'group' }, h('div', { class: 'group-h' }, 'Итого'), h('div', { class: 'list' },
    ...D.items.map(it => row({ title: `${L(it.loc).flag} ${L(it.loc).name} × ${it.count}`, sub: it.idx === 'custom' ? `своя: ${it.spec.cpu} vCPU, ${it.spec.ram} ГБ, ${it.spec.disk} ГБ` : '', detail: rubK(priceOf(it) * it.count) })),
    h('div', { class: 'total' }, h('span', {}, `${nodesWord}, ${PERIOD[D.period]}`), h('b', {}, rubK(sum))),
    row({ title: 'Платит', detail: D.cat.buyer }),
    row({ title: 'Баланс', detail: bal === null ? '—' : rubK(bal), status: enough ? null : ['не хватает', 'bad'] }),
    row({ title: 'Система', detail: D.cat.os_label }),
    row({ title: 'Traffic Control', detail: prof.traffic_control ? 'включён' : 'выключен' }))));
  const go = h('button', { class: 'btn', type: 'button', disabled: !enough || !D.picked }, own ? 'Установить ноды' : 'Купить и установить');
  go.onclick = UI.busy(go, async () => {
    const ok = await UI.ask(own
      ? { title: 'Установить ноды?', message: `${nodesWord} на уже купленные серверы. Покупки нет. Нода ставится поверх системы сервера.`, buttons: [{ id: 'y', text: 'Установить' }] }
      : { title: 'Купить и установить?', message: `${nodesWord}, ${rubK(sum)} спишется с баланса: ${D.cat.buyer}.`, buttons: [{ id: 'y', text: 'Купить' }] });
    if (!ok) return;
    const items = D.items.map(it => ({ location: it.loc, domains: D.domains[it.loc] || [],
      ...(own ? { servers: it.servers } : it.idx === 'custom' ? { spec: it.spec } : { idx: it.idx }) }));
    const r = await UI.run(() => api('deploy', 'POST', { pid: prof.id, items, period: D.period,
      squads: D.squads ? [...D.squads] : undefined, remark: D.remark, host_mode: D.hostMode, tags: D.tags,
      balancer_tag: D.tag, balancer_remark: D.bremark, balancer_template: D.btpl || null, remark_lang: D.lang,
      host_order: D.orderTouched && D.order ? D.order : undefined,
      ...extrasPayload(D.E), port: D.portMode === 'custom' ? D.port : null,
      final_mask: D.mask, final_mask_json: D.mask ? D.maskJson : undefined }), 'Задачи запущены');
    if (!r) return;
    const gid = D.pid; D = null; delete GJ[gid]; await load(); UI.nav.reset(); UI.nav.push(() => groupView(gid));
  });
  v.append(h('div', { class: 'pad' }, go,
    h('div', { class: 'group-f' }, D.picked ? 'Ход установки — на странице группы, в задачах и в чате с ботом.' : 'Подберите или проверьте домены, чтобы продолжить.')));
  return v;
}

// ───────── задачи ─────────
let JOBS = null, jobTimer = null;
function poll(fn, ms) { clearTimeout(jobTimer); jobTimer = setTimeout(fn, ms); }
async function loadJobs() { try { JOBS = (await api('jobs')).jobs; } catch (e) { JOBS = { error: e.message }; } }
function jobsView() {
  if (JOBS === null) { loadJobs().then(() => UI.nav.refresh()); return h('div', {}, ...title('Задачи'), group(null, [h('div', { class: 'skeleton' })])); }
  if (JOBS.error) return h('div', {}, ...title('Задачи'), h('div', { class: 'notice bad' }, JOBS.error));
  if (JOBS.some(j => ACTIVE_ST.includes(j.status)))
    poll(async () => { if (!document.querySelector('#root .jobs-page')) return; await loadJobs(); UI.nav.refresh(); }, 4000);
  const v = h('div', { class: 'jobs-page' }, ...title('Задачи'));
  if (!JOBS.length) { v.append(h('div', { class: 'empty' }, h('b', {}, 'Задач нет'), 'Они появятся после первого развёртывания.')); return v; }
  const act = JOBS.filter(j => ACTIVE_ST.includes(j.status)), bad = JOBS.filter(j => j.status === 'failed'), rest = JOBS.filter(j => !ACTIVE_ST.includes(j.status) && j.status !== 'failed');
  if (act.length) v.append(group(['Идут сейчас', h('span', { class: 'n' }, act.length)], act.map(jobRow)));
  if (bad.length) v.append(group(['С ошибкой', h('span', { class: 'n' }, bad.length)], bad.map(jobRow)));
  if (rest.length) v.append(group(['Готово', h('span', { class: 'n' }, rest.length)], rest.map(jobRow)));
  return v;
}
const JOB = {};
function jobView(id) {
  const j = JOB[id];
  const reload = async () => { try { JOB[id] = await api('jobs/' + id); } catch (e) { JOB[id] = { error: e.message }; } UI.nav.refresh(); };
  if (!j) { reload(); return h('div', {}, ...title('Задача', 'Задачи'), group(null, [h('div', { class: 'skeleton' })])); }
  if (j.error && !j.id) return h('div', {}, ...title('Задача', 'Задачи'), h('div', { class: 'notice bad' }, j.error));
  const active = ACTIVE_ST.includes(j.status);
  if (active) poll(() => { if (document.querySelector('#root .job-page')) reload(); }, 3000);
  const cur = j.stages.findIndex(s => s.code === j.stage);
  const v = h('div', { class: 'job-page' }, ...title(j.domain, 'Задачи'),
    h('div', { class: 'subtitle' }, [[j.flag, j.loc_name].filter(Boolean).join(' '), specText(j.spec), j.profile && 'группа ' + j.profile].filter(Boolean).join(', ')));
  if (j.status === 'failed') {
    const retry = h('button', { class: 'btn', type: 'button' }, 'Повторить');
    retry.onclick = UI.busy(retry, async () => {
      if (!j.server_id && !(await UI.ask({ title: 'Повторить?', message: 'Сервер ещё не был куплен — повтор купит новый.', buttons: [{ id: 'y', text: 'Повторить' }] }))) return;
      if (await UI.run(() => api('jobs/' + id + '/retry', 'POST'), 'Запущено снова')) reload();
    });
    v.append(h('div', { class: 'notice bad' }, h('b', {}, (j.stages[cur] || {}).label ? 'Остановилось на шаге «' + j.stages[cur].label + '». ' : 'Ошибка. '), j.error, retry));
  }
  if (j.status === 'done' && j.ip) v.append(group('Доступ', [
    row({ title: 'IP', detail: j.ip, mono: true, copy: j.ip, copyLabel: 'IP' }),
    j.password ? row({ title: 'Пароль root', detail: '••••••••••', copy: j.password, copyLabel: 'Пароль' }) : null].filter(Boolean)));
  const rail = h('ol', { class: 'rail' }, j.stages.map((s, i) => {
    const done = j.status === 'done' || i < cur, now = i === cur && !done;
    const cls = done ? 'done' : now ? (j.status === 'failed' ? 'fail' : 'now') : 'todo';
    return h('li', { class: cls }, h('i'), h('span', { class: 'label' }, s.label,
      now && active && j.last ? h('span', { class: 'live' }, String(j.last).replace(/^#{2,}\s*/, '')) : null),
      s.code === 'ip' && j.ip && done ? h('span', { class: 'val' }, j.ip) : null);
  }));
  v.append(group('Этапы', [rail]));
  const lines = j.log ? j.log.split('\n').length : 0;
  if (j.log) {
    const [fb, fbox] = UI.fold({ title: 'Журнал', summary: lines + ' ' + UI.plural(lines, 'строка', 'строки', 'строк'), key: 'log', open: j.status === 'failed',
      body: () => { const pre = h('pre', { class: 'log flat' }, j.log.slice(-20000).replace(/^#{2,}\s*/gm, '')); requestAnimationFrame(() => { pre.scrollTop = pre.scrollHeight; }); return pre; } });
    v.append(group(null, [fb, fbox]));
  } else v.append(group(null, [row({ title: 'Журнал', detail: 'появится при установке', cls: 'is-dim' })]));
  if (!active) v.append(group(null, [row({ title: 'Скрыть из списка', cls: 'accent', onClick: async () => {
    if (await UI.run(() => api('jobs/' + id + '/hide', 'POST'))) { JOBS = null; UI.nav.back(); } } })]));
  return v;
}

let lastDepth = 0;
document.addEventListener('navchange', e => {
  const back = e.detail.depth === 0 && lastDepth > 0;
  lastDepth = e.detail.depth;
  if (back) { JOBS = null; D = null; for (const k in GJ) delete GJ[k]; load(); }
});
UI.nav.mount(document.getElementById('root'), home);
load();
</script>
